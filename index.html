<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دفتري - المساعد الأكاديمي الشامل</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script>
window.onerror = function(msg, url, line) {
  var app = document.getElementById('app') || document.body;
  if(app) {
    app.innerHTML = '<div style="background:#fff;color:#b91c1c;padding:24px;margin:20px;border-radius:18px;border:2px solid #b91c1c;direction:rtl;text-align:right;font-family:sans-serif;box-shadow:0 10px 25px rgba(0,0,0,0.1);">'
      + '<h3 style="margin:0 0 12px;font-size:1.3rem">⚠️ تنبيه برمجي في النظام</h3>'
      + '<p style="font-family:monospace;background:#fef2f2;padding:12px;border-radius:10px;font-size:0.9rem;border:1px solid #fecaca;line-height:1.6">' + msg + '<br><b>السطر:</b> ' + line + '</p>'
      + '<div style="margin-top:16px;display:flex;gap:10px;">'
      + '<button onclick="location.reload(true);" style="padding:10px 18px;background:#0F3D2E;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">إعادة تشغيل الصفحة</button>'
      + '<button onclick="localStorage.clear();location.reload(true);" style="padding:10px 18px;background:#b91c1c;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">إعادة ضبط الذاكرة</button>'
      + '</div>'
      + '</div>';
  }
  return false;
};
</script>

<style>
/* =========================================================
   نظام التصميم والألوان الأساسية (Design System)
   ========================================================= */
:root {
  --primary: #0F3D2E;
  --primary-dark: #082C21;
  --primary-light: #176B4D;
  --primary-subtle: rgba(15, 61, 46, 0.08);
  --gold: #D4AF37;
  --gold-light: #F3E5AB;
  --gold-dark: #AA820A;
  --gold-subtle: rgba(212, 175, 55, 0.12);
  --bg: #F4F7F5;
  --surface: #FFFFFF;
  --surface2: #EDF3EF;
  --surface3: #E1ECE5;
  --border: #D8E3DC;
  --border-light: #E7EFEA;
  --text: #0D1C16;
  --text-secondary: #52665C;
  --text-muted: #7E9489;
  --success: #15803D;
  --success-subtle: rgba(21, 128, 61, 0.12);
  --warning: #B45309;
  --warning-subtle: rgba(180, 83, 9, 0.12);
  --danger: #B91C1C;
  --danger-subtle: rgba(185, 28, 28, 0.12);
  --info: #1D4ED8;
  --info-subtle: rgba(29, 78, 216, 0.12);
  --btn: #0F3D2E;
  --active: #176B4D;
  --shadow-sm: 0 2px 6px rgba(8, 44, 33, 0.05);
  --shadow-md: 0 4px 16px rgba(8, 44, 33, 0.08);
  --shadow-lg: 0 10px 30px rgba(8, 44, 33, 0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
}

[data-theme=dark] {
  --primary: #124032;
  --primary-dark: #071913;
  --primary-light: #208560;
  --primary-subtle: rgba(32, 133, 96, 0.15);
  --gold: #E5C158;
  --gold-light: #FDF3CF;
  --gold-dark: #B88E1B;
  --gold-subtle: rgba(229, 193, 88, 0.15);
  --bg: #071611;
  --surface: #0E251D;
  --surface2: #14352A;
  --surface3: #1C4436;
  --border: #1F4D3C;
  --border-light: #183C2F;
  --text: #F1F7F4;
  --text-secondary: #A6BFB3;
  --text-muted: #728F82;
  --btn: #208560;
  --active: #28A376;
  --shadow-sm: none;
  --shadow-md: none;
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: Cairo, Tajawal, "Segoe UI", Tahoma, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* خلفية التوهج العائمة */
.bg-ambient {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  will-change: transform;
}
[data-theme=dark] .glow-orb {
  opacity: 0.2;
}
.orb-1 {
  width: 380px;
  height: 380px;
  background: var(--gold);
  top: -100px;
  left: -80px;
  animation: floatA 26s ease-in-out infinite alternate;
}
.orb-2 {
  width: 420px;
  height: 420px;
  background: var(--primary-light);
  bottom: -120px;
  right: -100px;
  animation: floatB 32s ease-in-out infinite alternate;
}
.orb-3 {
  width: 260px;
  height: 260px;
  background: var(--gold-light);
  top: 45%;
  right: 5%;
  animation: floatC 22s ease-in-out infinite alternate;
}
@keyframes floatA {
  0% { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(70px, 80px, 0) scale(1.15); }
}
@keyframes floatB {
  0% { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-70px, -60px, 0) scale(1.2); }
}
@keyframes floatC {
  0% { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-40px, 50px, 0) scale(0.9); }
}
@media (prefers-reduced-motion: reduce) {
  .glow-orb { animation: none; }
}

/* الشريط العلوي */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--primary);
  color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
  backdrop-filter: blur(10px);
}
[data-theme=dark] header {
  background: var(--primary-dark);
}
header a.brand {
  color: inherit;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  width: 40px;
  height: 40px;
  flex: none;
}
header b {
  display: block;
  font-size: 1.15rem;
  line-height: 1.2;
}
header small {
  opacity: 0.85;
  font-size: 0.76rem;
  color: var(--gold-light);
}

.hdr-actions {
  margin-inline-start: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hdr-btn {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  width: 38px;
  height: 38px;
  border-radius: 11px;
  cursor: pointer;
  display: grid;
  place-items: center;
  text-decoration: none;
  transition: all 0.2s;
}
.hdr-btn:active {
  transform: scale(0.94);
  background: rgba(255, 255, 255, 0.2);
}
.hdr-btn svg {
  width: 20px;
  height: 20px;
  color: var(--gold-light);
}

main {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 16px 20px;
  position: relative;
  z-index: 1;
}

h1 { font-size: 1.55rem; margin: 16px 0 6px; font-weight: 800; }
h2 { font-size: 1.15rem; margin: 20px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 0.95rem; color: var(--active); margin: 12px 0 6px; font-weight: 700; }
small, .mu { color: var(--text-secondary); font-size: 0.82rem; }
p.mu { margin: 6px 0; }

.card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  color: inherit;
  text-decoration: none;
  position: relative;
  transition: transform 0.15s, border-color 0.15s;
}
button.card {
  width: 100%;
  text-align: start;
  font: inherit;
  cursor: pointer;
}
.card.interactive:active {
  transform: scale(0.99);
  border-color: var(--gold);
}

.hero-card {
  background: linear-gradient(145deg, var(--surface), var(--surface2));
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--gold), var(--primary-light));
}
.hero-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.iq-clock-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--gold-subtle);
  border: 1px solid rgba(212, 175, 55, 0.35);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16A34A;
  box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(22, 163, 74, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}

.big-stat {
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--active);
  line-height: 1.1;
  margin: 4px 0 2px;
}
.pb {
  height: 10px;
  border-radius: 999px;
  background: var(--border);
  overflow: hidden;
  margin: 10px 0 8px;
}
.pb i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary-light), var(--gold));
  transition: width 0.4s ease;
}

.st4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.st4 span {
  font-size: 0.74rem;
  color: var(--text-secondary);
}
.st4 b {
  display: block;
  font-size: 1.25rem;
  color: var(--text);
  font-weight: 800;
  line-height: 1.2;
}

.hub-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.hub-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text);
  font-weight: 700;
  font-size: 0.74rem;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s, border-color 0.15s;
}
.hub-btn:active {
  transform: scale(0.96);
  border-color: var(--gold);
}
.hub-icon-box {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--surface2);
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  color: var(--primary);
  border: 1px solid var(--border-light);
}

.now-card {
  border: 2px solid var(--gold);
  background: linear-gradient(145deg, var(--surface), var(--gold-subtle));
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
}
.now-tag {
  display: inline-block;
  background: var(--gold);
  color: var(--primary-dark);
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.now-card b {
  display: block;
  font-size: 1.15rem;
  margin-bottom: 4px;
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 12px;
  margin: 6px 0;
  transition: background 0.2s, border-color 0.2s;
}
.ck {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--active);
  background: none;
  color: #fff;
  display: grid;
  place-items: center;
  flex: none;
  cursor: pointer;
  transition: all 0.2s;
}
.done .ck {
  background: var(--success);
  border-color: var(--success);
}
.done b {
  text-decoration: line-through;
  color: var(--text-muted);
}
.tb {
  flex: 1;
  text-align: start;
  background: none;
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  display: block;
  min-width: 0;
}
.tb b {
  display: block;
  font-size: 0.94rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb small {
  display: block;
  font-size: 0.76rem;
}
.st {
  background: none;
  border: 0;
  color: var(--text-muted);
  padding: 6px;
  cursor: pointer;
}
.st.on {
  color: var(--gold);
}
.st.on svg {
  fill: var(--gold);
}

.btn {
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  min-height: 46px;
  font: inherit;
  font-weight: 700;
  background: var(--btn);
  color: #fff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  margin: 4px 0;
  gap: 8px;
  transition: all 0.15s;
}
.btn:hover { background: var(--primary-light); }
.btn:active { transform: scale(0.98); }
.btn.gold { background: var(--gold); color: var(--primary-dark); }
.btn.gold:hover { background: var(--gold-light); }
.btn.danger { background: var(--danger); }
.btn.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn.block { display: flex; width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 0.82rem; border-radius: 10px; }

.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.r2:has(input) { grid-template-columns: 1fr auto; }
.r2 input[type=date] { grid-column: auto; }
.r4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }

input, select, textarea {
  width: 100%;
  font: inherit;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  min-height: 46px;
  margin: 4px 0;
}
textarea { min-height: 70px; resize: vertical; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { border: 0; background: none; padding: 0; font: inherit; color: var(--text); position: relative; }
.chip span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 0.85rem; }
.chip input { position: absolute; opacity: 0; }
.chip input:checked + span, .chip.on span { background: var(--btn); color: #fff; border-color: var(--btn); }

details.custom-accordion {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin: 12px 0;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
details.custom-accordion summary {
  padding: 14px 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface);
  user-select: none;
}
details.custom-accordion[open] summary {
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.accordion-content {
  padding: 14px;
}

.link-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 10px 0;
}
.link-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface2);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  width: 100%;
  text-align: start;
  transition: transform 0.15s, border-color 0.15s;
}
.link-card:active {
  transform: scale(0.99);
  border-color: var(--gold);
}
.link-thumb {
  width: 50px;
  height: 42px;
  border-radius: 10px;
  flex: none;
  display: grid;
  place-items: center;
  background: #000;
  color: #fff;
  overflow: hidden;
}
.link-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.link-thumb.yt { background: #CC0000; }
.link-thumb.tg { background: #229ED9; }
.link-thumb.drive { background: #10B981; }
.link-thumb.web { background: var(--primary); }

.link-info {
  flex: 1;
  min-width: 0;
}
.link-badge {
  font-size: 0.68rem;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 6px;
  display: inline-block;
  margin-bottom: 2px;
}
.badge-yt { background: rgba(204, 0, 0, 0.15); color: #DC2626; }
.badge-tg { background: rgba(34, 158, 217, 0.15); color: #0284C7; }
.badge-drive { background: rgba(16, 185, 129, 0.15); color: #059669; }
.badge-web { background: rgba(15, 61, 46, 0.15); color: var(--primary); }

.link-info b {
  display: block;
  font-size: 0.9rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.link-info small {
  display: block;
  font-size: 0.74rem;
  color: var(--text-secondary);
}

.tt-box {
  border: 2px dashed var(--gold);
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 18px;
  text-align: center;
  margin: 12px 0;
}
.tt-preview {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: #06140F;
  cursor: pointer;
  max-height: 170px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
}
.tt-preview img {
  width: 100%;
  height: auto;
  max-height: 170px;
  object-fit: cover;
  opacity: 0.9;
}
.tt-overlay {
  position: absolute;
  background: rgba(8, 44, 33, 0.9);
  color: #fff;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 800;
  border: 1px solid var(--gold);
  display: flex;
  align-items: center;
  gap: 6px;
}

nav {
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 25;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
}
nav a {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 10px 0 8px;
  font-size: 0.72rem;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.15s;
}
nav a[aria-current] {
  color: var(--active);
  font-weight: 800;
}
nav a[aria-current] svg {
  color: var(--gold);
  transform: translateY(-2px);
}
nav a svg {
  transition: transform 0.2s;
}

#sh { position: fixed; inset: 0; z-index: 40; }
#sh[hidden], #ob[hidden] { display: none; }
#sh .bk { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); }
#sh .sb {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  max-width: 660px;
  margin: auto;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

#toasts {
  position: fixed;
  top: calc(70px + env(safe-area-inset-top));
  inset-inline: 0;
  z-index: 50;
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}
#toasts div {
  background: var(--primary-dark);
  color: #fff;
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 11px 20px;
  font-size: 0.92rem;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  max-width: 90%;
  animation: slideDown 0.25s ease;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.yt-embed-box {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border);

  return new Promise(function(res, rej){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        var st = db.createObjectStore(DB_STORE, {keyPath: 'id'});
        st.createIndex('sid', 'sid', {unique: false});
      }
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function idbPut(rec){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put(rec); tx.oncomplete = res; tx.onerror = rej; }); }); }
function idbGetAll(sid){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readonly'); var req = tx.objectStore(DB_STORE).index('sid').getAll(sid); req.onsuccess = function(){ res(req.result || []); }; req.onerror = rej; }); }); }
function idbDel(id){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).delete(id); tx.oncomplete = res; tx.onerror = rej; }); }); }

function archive(b){
  var w = b.week;

  b.archive.unshift({
    id: uid(),

    subs: b.subjects.map(function(s){ return {id: s.id, name: s.name}; }),
    tasks: w.tasks || [],

    done: (w.tasks||[]).filter(function(t){ return t && t.done; }).length,
    pct: pct(w.tasks||[])
  });
  return true;
}

function rollover(b){
  var cur = wk(nowIQ());
  if(!b.week){
    b.week = { start: cur, tasks: [], notes: {} };
    return true;
  }
  if(b.week.start !== cur){
    archive(b);
    var carried = (b.week.tasks || []).filter(function(t){ return t && (!t.done || t.rec); });
    var incoming = (b.nextWeekTasks || []).map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); });
    b.nextWeekTasks = [];
    b.week = {
      start: cur,
      tasks: [...carried.map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); }), ...incoming],
      notes: {}
    };
    return true;
  }
  return false;
}

function nowTask(b){
  if(!b.week || !Array.isArray(b.week.tasks)) return null;
  var tp = nowIQ().getDay();

    var d = Number(t.day) || 0;
    var s = ({h:30, m:20, l:10}[t.pr] || 20) + (d === tp ? 100 : d < tp ? 80 - (tp - d) : 50 - (d - tp) * 5) - i / 100;
    if(s > bs){ bs = s; best = t; }
  });
  return best;
}

var alarmCtx = null, alarmOsc = null, alarmPulse = null, currentMathAns = null;
function initAudio(){

function startAlarmSound(){
  try {
    initAudio();
    stopAlarmSound();
    if(!alarmCtx) return;
    alarmOsc = alarmCtx.createOscillator();
    var gain = alarmCtx.createGain();
    alarmOsc.type = 'sawtooth';
    alarmOsc.frequency.setValueAtTime(800, alarmCtx.currentTime);
    gain.gain.setValueAtTime(0.3, alarmCtx.currentTime);
    alarmOsc.connect(gain);
    gain.connect(alarmCtx.destination);
    alarmOsc.start();
    var up = true;
    alarmPulse = setInterval(function(){
      if(alarmOsc && alarmCtx){
        alarmOsc.frequency.setValueAtTime(up ? 1100 : 750, alarmCtx.currentTime);
        up = !up;
      }
    }, 400);
  } catch(e){}
}

  try { if(alarmPulse) clearInterval(alarmPulse); alarmPulse = null; } catch(e){}

    var badgeClass = isYt ? 'badge-yt' : (isTg ? 'badge-tg' : (isDrive ? 'badge-drive' : 'badge-web'));
    var badgeTxt = isYt ? 'YouTube 🎥' : (isTg ? 'Telegram 📢' : (isDrive ? 'Drive 📁' : 'رابط خارجي 🔗'));
    var thumbBox = isYt ? (vid ? '<img src="https://img.youtube.com/vi/' + vid + '/mqdefault.jpg" alt="Thumb">' : '🎥') : (isTg ? '📢' : (isDrive ? '📁' : '🔗'));
    var thumbClass = isYt ? 'yt' : (isTg ? 'tg' : (isDrive ? 'drive' : 'web'));

    return '<div class="link-card" data-a="openSubjectLink" data-url="' + esc(url) + '" data-title="' + esc(item.title) + '" data-isyt="' + (isYt?'1':'0') + '" data-vid="' + esc(vid||'') + '">'
      + '<div class="link-thumb ' + thumbClass + '">' + thumbBox + '</div>'

      + '</div>'
      + '</div>';
  }).join('');

  return '<div class="link-grid">' + h + '</div>';
}

var taskRow = function(t, ro, isNextWeek){
  if(!t) return '';
  var pr = PR[t.pr] || PR.m;
  return '<div class="task ' + (t.done ? 'done' : '') + '">'
    + '<button class="ck" ' + (ro || isNextWeek ? 'disabled' : 'data-a="tog" data-id="' + esc(t.id) + '"') + ' aria-label="إنجاز">' + (t.done ? ic('check') : '') + '</button>'
    + '<button class="tb" ' + (ro ? 'disabled' : (isNextWeek ? 'data-a="editNextTask" data-id="' + esc(t.id) + '"' : 'data-a="edit" data-id="' + esc(t.id) + '"')) + '><b>' + esc(t.t) + '</b><small>' + esc(t.sn || '') + ' · ' + pr[0] + ' ' + pr[1] + (t.rec ? ' · 🔁' : '') + (isNextWeek ? ' · 🔮 الأسبوع القادم' : '') + '</small>' + (t.note ? '<small>📝 ' + esc(t.note) + '</small>' : '') + '</button>'
    + '<button class="st ' + (t.star ? 'on' : '') + '" ' + (ro || isNextWeek ? 'disabled' : 'data-a="star" data-id="' + esc(t.id) + '"') + ' aria-label="للمراجعة">' + ic('star') + '</button>'
    + '</div>';
};

function dayBlocks(tasks, ro, startIso){
  tasks = Array.isArray(tasks) ? tasks : [];
  var b = B();
  var curIso = iso(nowIQ());
  var todayIdx = nowIQ().getDay();
  var sDays = (S && S.settings && Array.isArray(S.settings.days)) ? S.settings.days : [0,1,2,3,4];
  var ds = [...new Set([...sDays, todayIdx, ...tasks.map(function(t){ return t ? Number(t.day) : 0; })])].sort(function(a,c){ return a - c; });
  
  return ds.map(function(d){
    var dayDate = startIso ? addD(startIso, d) : null;
    var isToday = (dayDate === curIso) || (d === todayIdx);
    var dtTxt = dayDate ? (' · ' + fd(dayDate)) : '';
    var todayBadge = isToday ? '<span class="chip on" style="font-size:.72rem;padding:2px 8px;margin-inline-start:4px;background:var(--gold);color:#082C21;font-weight:bold">اليوم</span>' : '';
    
    var daySubs = (b.subjects || []).filter(function(s){ return (s.days || []).includes(d); });
    var daySubsHtml = '';
    if(daySubs.length > 0){
      daySubsHtml = '<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px;align-items:center">'
        + '<small style="color:var(--gold);font-weight:bold;margin-inline-end:4px">📚 مواد اليوم:</small>'
        + daySubs.map(function(s){
            return '<span style="font-size:0.75rem;padding:2px 8px;border-radius:8px;background:var(--surface2);border:1px solid var(--border)">' + esc(s.name) + '</span>';
          }).join('')
        + '</div>';
    }

    var T = tasks.filter(function(t){ return t && Number(t.day) === d; });
    var g = {};
    T.forEach(function(t){
      if(!t) return;
      var n = t.sn || 'عام';
      if(!g[n]) g[n] = [];
      g[n].push(t);
    });
    var listHtml = T.length ? Object.keys(g).map(function(n){
      return '<h3>' + esc(n) + '</h3>' + g[n].map(function(t){ return taskRow(t, ro, false); }).join('');
    }).join('') : '<p class="mu" style="font-size:0.8rem">لا توجد مهام مسجلة لهذا اليوم</p>';

    return '<section class="card ' + (isToday ? 'now' : '') + '">'
      + '<div class="dh">'
      + '<b>' + (DN[d] || '') + ' <span style="font-weight:normal;color:var(--text-secondary);font-size:.85rem">' + dtTxt + '</span> ' + todayBadge + '</b>'
      + '<small>' + T.length + ' مهام · ' + T.filter(function(t){ return t && t.done; }).length + ' مكتملة</small>'
      + '</div>'
      + daySubsHtml
      + listHtml
      + '</section>';
  }).join('');
}

var fl = function(t){
  if(!t) return false;
  var q = F.q.trim();
  if(q && !((t.t || '') + ' ' + (t.sn || '')).includes(q)) return false;
  return { all: 1, done: t.done, todo: !t.done, high: t.pr === 'h', star: t.star, late: !t.done && (Number(t.day)||0) < nowIQ().getDay() }[F.f];
};
var weekList = function(b){ return dayBlocks((b.week && Array.isArray(b.week.tasks) ? b.week.tasks : []).filter(fl), false, b.week ? b.week.start : null); };
var dayOpts = function(sel){ return [...new Set([...((S.settings && S.settings.days) || [0,1,2,3,4]), sel])].sort(function(a,c){ return a - c; }).map(function(d){ return '<option value="' + d + '" ' + (d === sel ? 'selected' : '') + '>' + (DN[d] || '') + '</option>'; }).join(''); };

/* صفحة الإحصائيات */
function pStats(b){
  var T = (b.week && Array.isArray(b.week.tasks)) ? b.week.tasks : [];
  var arch = Array.isArray(b.archive) ? b.archive : [];
  var all = [...T, ...arch.flatMap(function(a){ return Array.isArray(a.tasks) ? a.tasks : []; })];
  var m = {};
  all.forEach(function(t){
    if(!t) return;
    var sn = t.sn || 'عام';
    var o = m[sn] = m[sn] || { d: 0, n: 0 };
    if(t.done) o.d++; else o.n++;
  });
  var e = Object.entries(m);
  var top = [...e].sort(function(a,c){ return c[1].d - a[1].d; })[0];
  var need = e.filter(function(x){ return x[1].n; }).sort(function(a,c){ return c[1].n - a[1].n; })[0];
  var mins = (Array.isArray(b.sessions) ? b.sessions : []).reduce(function(s,x){ return s + (x.m || 0); }, 0);
  var row = function(l,v){ return '<div class="card dh"><span>' + l + '</span><b>' + v + '</b></div>'; };

A.viewDoc = async function(d){
  var db = await idb();
  var tx = db.transaction(DB_STORE, 'readonly');
  var req = tx.objectStore(DB_STORE).get(d.docid);
  req.onsuccess = function(){
    var doc = req.result;
    if(!doc) return toast('الملف غير موجود');
    var blob = doc.blob;
    if(!blob) return toast('تعذر فتح الملف');
    var url = URL.createObjectURL(blob);
    var type = (doc.type || '').toLowerCase();
    var isImg = type.startsWith('image/') || /\.(png|jpe?g|webp|gif|svg)$/i.test(doc.name);
    var isPdf = type.includes('pdf') || /\.pdf$/i.test(doc.name);

    if(isImg){
      sheet('<div class="dh" style="margin-bottom:8px">'
        + '<b style="max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📖 ' + esc(doc.name) + '</b>'
        + '<button class="btn ghost sm" data-a="close">✕ إغلاق</button>'
        + '</div>'
        + '<div style="overflow:auto;max-height:75vh;text-align:center;background:#000;border-radius:14px;padding:4px">'
        + '<img src="' + url + '" style="max-width:100%;height:auto;display:block;margin:auto" alt="' + esc(doc.name) + '">'
        + '</div>');
    } else if(isPdf){
      sheet('<div class="dh" style="margin-bottom:8px">'
        + '<b style="max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📖 ' + esc(doc.name) + '</b>'
        + '<button class="btn ghost sm" data-a="close">✕ إغلاق</button>'
        + '</div>'
        + '<div style="width:100%;height:70vh;border-radius:14px;overflow:hidden;background:#525659">'
        + '<iframe src="' + url + '#toolbar=1&navpanes=0" style="width:100%;height:100%;border:none;display:block"></iframe>'
        + '</div>'
        + '<div class="r2" style="margin-top:8px">'
        + '<button class="btn gold sm block" data-a="openExternalUrl" data-url="' + url + '">📖 ملء الشاشة ↗</button>'
        + '<button class="btn ghost sm block" data-a="dlDoc" data-docid="' + esc(doc.id) + '">تحميل ⬇</button>'
        + '</div>');
    } else {
      window.open(url, '_blank');
    }
  };
};

A.dlDoc = async function(d){
  var db = await idb();
  var tx = db.transaction(DB_STORE, 'readonly');
  var req = tx.objectStore(DB_STORE).get(d.docid);
  req.onsuccess = function(){
    var doc = req.result;
    if(!doc) return toast('الملف غير موجود');
    var url = URL.createObjectURL(doc.blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = doc.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
  };
};

function boot(){
  try {
    load(); applyTheme();
    if(S.settings.done){ rollover(B()); save(); }
    render();
    
    document.addEventListener('click', function(e){
      initAudio();
      var el = e.target.closest('[data-a]');
      if(el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el);
    });
    
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target && e.target.id === 'alarm_ans'){
        A.submitAlarmAns();
      }
    });

    document.addEventListener('input', function(e){ if(e.target.id === 'q'){ F.q = e.target.value; $('#wl').innerHTML = weekList(B()); } });

    var ttInput = $('#tt_fi');
    if(ttInput){
      ttInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var canvas = document.createElement('canvas');
            var maxW = 1200, maxH = 1200;
            var w = img.width, h = img.height;
            if(w > maxW || h > maxH){
              if(w > h){ h = Math.round(h * maxW / w); w = maxW; }
              else { w = Math.round(w * maxH / h); h = maxH; }
            }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var base64 = canvas.toDataURL('image/jpeg', 0.8);
            var b = B();
            b.timetableImg = base64;
            if(save()){ closeSheet(); render(); toast('تم حفظ جدول المحاضرات بنجاح ✓'); }
            else { toast('تعذر الحفظ: مساحة التخزين ممتلئة'); }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        ttInput.value = '';
      });
    }

    var docInput = $('#sub_doc_fi');
    if(docInput){
      docInput.addEventListener('change', async function(e){
        var file = e.target.files && e.target.files[0];
        if(!file || !curSubDocsId) return;
        var docObj = {
          id: uid(),
          sid: curSubDocsId,
          name: file.name,
          size: file.size,
          type: file.type || 'application/octet-stream',
          blob: file,
          date: iso(nowIQ())
        };
        await idbPut(docObj);
        var sub = B().subjects.find(function(s){ return s.id === curSubDocsId; });
        if(sub){
          var docs = await idbGetAll(curSubDocsId);
          sub.docCount = docs.length;
          save();
        }
        toast('تم حفظ الملزمة بنجاح ✓');
        docInput.value = '';
        A.openSubDocs({ id: curSubDocsId, name: (sub ? sub.name : '') });
      });
    }

    document.addEventListener('change', function(e){
      var t = e.target, b = B();
      if(t.dataset.note){ b.week.notes = b.week.notes || {}; b.week.notes[t.dataset.note] = t.value; save(); toast('تم حفظ الملاحظة ✓'); }
      else if(t.id==='yr'){ S.settings.year = t.value.trim(); rollover(B()); save(); render(); toast('تم تحديث السنة الدراسية'); }
      else if(t.name === 'wd'){ var d = [...document.querySelectorAll('[name=wd]:checked')].map(function(x){ return +x.value; }); if(!d.length){ t.checked = true; return toast('اختر يوم دوام واحدًا على الأقل'); } S.settings.days = d; save(); }
      else if(t.id === 'gl'){ S.settings.goal = Math.min(100, Math.max(10, +t.value || 90)); save(); toast('تم حفظ الهدف ✓'); }
      else if(t.id === 'fi' && t.files[0]){
        var r = new FileReader();
        r.onload = function(){
          var o = null;
          try { o = JSON.parse(r.result); } catch(err){}
          if(!validate(o)) toast('الملف غير صالح — لم يتم تغيير بياناتك');
          else ask('سيتم استبدال بياناتك الحالية بالنسخة المستوردة.', 'استيراد', function(){ S = o; S.settings.done = true; rollover(B()); save(); applyTheme(); render(); toast('تم استيراد البيانات ✓'); }, false);
          t.value = '';
        };
        r.readAsText(t.files[0]);
      }
    });

    addEventListener('hashchange', function(){ closeSheet(); render(); scrollTo(0, 0); });
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });

    if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js?v=15').catch(function(){});
    }
  } catch(err) {
    if(window.onerror) window.onerror(err.message, '', 0);
  }
}
if(typeof document !== 'undefined') boot();
</script>
</body>
</html>
