<style>
:root{--primary:#0F3D2E;--primary-dark:#082C21;--primary-light:#176B4D;--gold:#D4AF37;--gold-light:#E6C766;--bg:#F5F7F5;--surface:#fff;--surface2:#EBF1ED;--border:#DDE5E0;--text:#12201A;--text-secondary:#64736C;--text-muted:#8A9690;--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#2563EB;--exam:#7C3AED;--btn:#0F3D2E;--active:#176B4D;--shadow:0 2px 10px rgba(8,44,33,.07)}
[data-theme=dark]{--bg:#071A14;--surface:#0D2A20;--surface2:#12372A;--border:#1C4A39;--text:#F4F7F5;--text-secondary:#AABAB2;--text-muted:#8FA198;--btn:#2A8C68;--active:#2A8C68;--shadow:none}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:calc(78px + env(safe-area-inset-bottom));position:relative;min-height:100vh}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
[data-theme=dark] header{background:var(--primary-dark)}
header a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px}
header .hdr-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
header .hdr-btn{color:var(--gold-light);background:none;border:none;padding:6px;cursor:pointer;display:grid;place-items:center;font-size:1.15rem;border-radius:8px}
.logo{width:38px;height:38px;flex:none}header b{display:block;font-size:1.05rem;line-height:1.2}header small{opacity:.8;font-size:.75rem}
main{max-width:640px;margin:0 auto;padding:6px 16px 16px;position:relative;z-index:1}
h1{font-size:1.5rem;margin:14px 0 4px}h2{font-size:1rem;margin:18px 0 8px}h3{font-size:.9rem;color:var(--active);margin:10px 0 4px}
small,.mu{color:var(--text-secondary);font-size:.82rem}p.mu{margin:6px 0}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
button.card{width:100%;text-align:start;font:inherit;cursor:pointer}.card.ex span,.card.ex small{display:block}
.hero{border-top:3px solid var(--gold)}.warn{border-color:var(--warning)}.now{border-color:var(--gold)}.now b{display:block;font-size:1.05rem}

.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--text-secondary)}.st4 b{display:block;font-size:1.15rem;color:var(--text)}
.ic{width:22px;height:22px;flex:none}
.btn{border:0;border-radius:14px;padding:11px 18px;min-height:46px;font:inherit;font-weight:700;background:var(--btn);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin:4px 0}
.btn:hover{background:var(--primary-light)}.btn.gold{background:var(--gold);color:var(--primary-dark)}.btn.gold:hover{background:var(--gold-light)}
.btn.danger{background:var(--danger)}.btn.ghost{background:var(--surface2);color:var(--text)}.btn.block{display:flex;width:100%}.btn.sm{min-height:34px;padding:4px 12px;font-size:.82rem}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r2:has(input){grid-template-columns:1fr auto}.r2 input[type=date]{grid-column:auto}.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:46px;margin:3px 0}
textarea{min-height:64px;resize:vertical}input[type=checkbox]{width:auto;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.chip{border:0;background:none;padding:0;font:inherit;color:var(--text);position:relative}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.chip input{position:absolute;opacity:0}.chip input:checked+span,.chip.on span{background:var(--btn);color:#fff;border-color:var(--btn)}.chip input:focus-visible+span{outline:2px solid var(--gold)}

.task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 10px;margin:6px 0}

.link-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.link-card{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:start}
.link-thumb{width:56px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;background:#000;color:#fff;overflow:hidden}

.link-thumb.yt{background:#CC0000}
.link-thumb.tg{background:#229ED9}

.badge-yt{background:rgba(204,0,0,.15);color:#CC0000}
.badge-tg{background:rgba(34,158,217,.15);color:#0284c7}
.badge-drive{background:rgba(16,185,129,.15);color:#059669}
.link-info b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tt-box{border:2px dashed var(--gold);background:var(--surface);border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.tt-preview{position:relative;border-radius:14px;overflow:hidden;background:#06140f;cursor:pointer;max-height:160px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.tt-preview img{width:100%;height:auto;max-height:160px;object-fit:cover;opacity:0.85}

/* التوهج المتحرك في الخلفية */
.bg-ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow-orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:.12;will-change:transform}
[data-theme=dark] .glow-orb{opacity:.18}
.orb-1{width:320px;height:320px;background:var(--gold);top:-80px;left:-60px;animation:floatA 24s ease-in-out infinite alternate}
.orb-2{width:360px;height:360px;background:var(--primary-light);bottom:-100px;right:-80px;animation:floatB 28s ease-in-out infinite alternate}
.orb-3{width:220px;height:220px;background:var(--gold-light);top:50%;right:10%;animation:floatC 20s ease-in-out infinite alternate}
@keyframes floatA{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(60px,70px,0) scale(1.15)}}
@keyframes floatB{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-60px,-50px,0) scale(1.18)}}
@keyframes floatC{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-40px,40px,0) scale(0.92)}}
@media (prefers-reduced-motion: reduce){.glow-orb{animation:none}}

/* قائمة ملفات المادة */
.file-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin:6px 0}
.file-row .fic{width:32px;height:32px;border-radius:8px;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none;font-size:.85rem;font-weight:700}
.file-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem;cursor:pointer}
.file-row .fs{font-size:.68rem;color:var(--text-muted);display:block}
.file-ord{display:flex;flex-direction:column;gap:1px}
.file-ord button{background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);cursor:pointer;font-size:.7rem;padding:2px 6px}
.yt-embed{position:relative;width:100%;padding-bottom:56.25%;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border)}
.yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* أزرار وشارات الأدوات الجديدة في كرت المادة */
.sub-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0 6px}
.tool-btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:6px 8px;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;text-align:center}
.tool-btn:active{transform:scale(.98)}
.abs-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:.78rem;font-weight:700}
.abs-ok{background:rgba(22,163,74,.15);color:var(--success)}
.abs-warn{background:rgba(217,119,6,.15);color:var(--warning)}
.abs-danger{background:rgba(220,38,38,.15);color:var(--danger)}
.flashcard-box{min-height:180px;border:2px dashed var(--gold);border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;cursor:pointer;margin:12px 0}
</style>
</head>

<script>
var DN = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var PR = {h:['🔴','عالية'],m:['🟡','متوسطة'],l:['🟢','منخفضة']};
var KEY = 'mds_v1', A = {}, S = null, R = 'home', F = {q:'', f:'all'}, OB = null;
var weekOpen = false, nextWeekOpen = false;
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var uid = function(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); };

function nowIQ(){
  var d = new Date();
  var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
  return new Date(utc + (3 * 3600000));
}
function getIraqTimeStr(){
  try {
    return nowIQ().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  } catch(e) {
    return nowIQ().toLocaleTimeString();
  }
}

var iso = function(d){ var x = (d instanceof Date && !isNaN(d)) ? d : nowIQ(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
var pd = function(s){ if(!s || typeof s !== 'string') return nowIQ(); var p = s.split('-').map(Number); return new Date(p[0]||2026, (p[1]||1)-1, p[2]||1); };
var wk = function(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return iso(x); };
var addD = function(s, n){ var x = pd(s); x.setDate(x.getDate() + (Number(n)||0)); return iso(x); };
var fd = function(s){ if(!s) return ''; var x = pd(s); return x.getFullYear() + '/' + String(x.getMonth()+1).padStart(2,'0') + '/' + String(x.getDate()).padStart(2,'0'); };
var rng = function(s){ return fd(s) + ' — ' + fd(addD(s,6)); };
var pct = function(T){ return (Array.isArray(T) && T.length) ? Math.round(100 * T.filter(function(t){ return t && t.done; }).length / T.length) : 0; };

var I = {
  home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',
  cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',

  exam:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
  box:'M3 7h18v4H3zM5 11v9h14v-9M10 15h4',
  gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z',
  star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  check:'M5 12l5 5 9-10',
  trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',

  clip:'M21 12.5l-8.5 8.5a5 5 0 01-7-7l8-8a3.5 3.5 0 015 5l-8 8a2 2 0 01-3-3l7-7'
};
var ic = function(n){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (I[n]||'') + '"/></svg>'; };
var credit = '<div class="cr"><a href="https://instagram.com/5k50m" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>صنع بواسطة @5k50m</a></div>';
var prog = function(p){ return '<div class="pb" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>'; };

/* IndexedDB */
var DB_NAME = 'daftari_files_db', DB_STORE = 'sub_docs';
function idb(){
  return new Promise(function(res, rej){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        var st = db.createObjectStore(DB_STORE, {keyPath: 'id'});
        st.createIndex('sid', 'sid', {unique: false});
      }
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function idbPut(rec){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put(rec); tx.oncomplete = res; tx.onerror = rej; }); }); }
function idbGetAll(sid){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readonly'); var req = tx.objectStore(DB_STORE).index('sid').getAll(sid); req.onsuccess = function(){ res(req.result || []); }; req.onerror = rej; }); }); }
function idbDel(id){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).delete(id); tx.oncomplete = res; tx.onerror = rej; }); }); }

function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
  if(!S || typeof S !== 'object' || !S.settings || !S.b){
    S = { v: 1, settings: { dark: null, days: [0,1,2,3,4], course: 1, year: '', goal: 90, done: false, alarm: { time: '', active: false } }, b: {} };
  }
  if(!Array.isArray(S.settings.days)) S.settings.days = [0,1,2,3,4];

function B(){

function rollover(b){

  if(!b.week){

  }
  if(b.week.start !== cur){
    archive(b);
    var carried = (b.week.tasks || []).filter(function(t){ return t && (!t.done || t.rec); });
    var incoming = (b.nextWeekTasks || []).map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); });
    b.nextWeekTasks = [];
    b.week = {
      start: cur,
      tasks: [...carried.map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); }), ...incoming],
      notes: {}
    };
    return true;

}

function nowTask(b){
  if(!b.week || !Array.isArray(b.week.tasks)) return null;
  var tp = nowIQ().getDay();

    var d = Number(t.day) || 0;
    var s = ({h:30, m:20, l:10}[t.pr] || 20) + (d === tp ? 100 : d < tp ? 80 - (tp - d) : 50 - (d - tp) * 5) - i / 100;
    if(s > bs){ bs = s; best = t; }

}

var alarmCtx = null, alarmOsc = null, alarmPulse = null, currentMathAns = null;
function initAudio(){
  if(!alarmCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) alarmCtx = new AC();
  }
  if(alarmCtx && alarmCtx.state === 'suspended') alarmCtx.resume();
}
function startAlarmSound(){
  try {
    initAudio();
    stopAlarmSound();
    if(!alarmCtx) return;
    alarmOsc = alarmCtx.createOscillator();
    var gain = alarmCtx.createGain();
    alarmOsc.type = 'sawtooth';
    alarmOsc.frequency.setValueAtTime(800, alarmCtx.currentTime);
    gain.gain.setValueAtTime(0.3, alarmCtx.currentTime);
    alarmOsc.connect(gain);
    gain.connect(alarmCtx.destination);
    alarmOsc.start();
    var up = true;
    alarmPulse = setInterval(function(){
      if(alarmOsc && alarmCtx){
        alarmOsc.frequency.setValueAtTime(up ? 1100 : 750, alarmCtx.currentTime);
        up = !up;
      }
    }, 400);
  } catch(e){}
}
function stopAlarmSound(){
  try { if(alarmPulse) clearInterval(alarmPulse); alarmPulse = null; } catch(e){}
  try { if(alarmOsc){ alarmOsc.stop(); alarmOsc.disconnect(); alarmOsc = null; } } catch(e){}
}
function triggerSmartAlarm(){
  startAlarmSound();
  var n1 = Math.floor(Math.random() * 40) + 12;
  var n2 = Math.floor(Math.random() * 40) + 11;
  currentMathAns = n1 + n2;
  sheet('<div style="text-align:center;padding:8px">'

    + '<div class="card" style="font-size:1.9rem;font-weight:900;letter-spacing:2px;background:var(--surface2)">'
    + n1 + ' + ' + n2 + ' = ؟'

/* أصوات التركيز المدمجة (Focus Ambient Sounds) برمجياً عبر Web Audio */
var ambNode = null, ambGain = null, curAmb = null;
function playAmbientSound(type){
  initAudio();
  stopAmbientSound();
  if(!alarmCtx) return;
  curAmb = type;
  var bufSize = alarmCtx.sampleRate * 2;
  var noiseBuf = alarmCtx.createBuffer(1, bufSize, alarmCtx.sampleRate);
  var output = noiseBuf.getChannelData(0);
  var b0 = 0, b1 = 0, b2 = 0;
  for(var i = 0; i < bufSize; i++){
    var white = Math.random() * 2 - 1;
    if(type === 'rain'){
      b0 = 0.95 * b0 + white * 0.05;
      output[i] = b0 * 3.5;
    } else if(type === 'waves'){
      b0 = 0.98 * b0 + white * 0.02;
      output[i] = b0 * 4.0;
    } else {
      output[i] = white * 0.15; // ضجيج أبيض ناعم
    }
  }
  var whiteNoise = alarmCtx.createBufferSource();
  whiteNoise.buffer = noiseBuf;
  whiteNoise.loop = true;
  var filter = alarmCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(type === 'rain' ? 1200 : (type === 'waves' ? 650 : 900), alarmCtx.currentTime);
  ambGain = alarmCtx.createGain();
  ambGain.gain.setValueAtTime(0.2, alarmCtx.currentTime);
  whiteNoise.connect(filter);
  filter.connect(ambGain);
  ambGain.connect(alarmCtx.destination);
  whiteNoise.start();
  ambNode = whiteNoise;
  toast('تم تشغيل صوت ' + (type==='rain'?'المطر 🌧️':(type==='waves'?'الأمواج 🌊':'الهدوء 💨')));
}
function stopAmbientSound(){
  curAmb = null;
  if(ambNode){ try{ ambNode.stop(); ambNode.disconnect(); }catch(e){} ambNode = null; }
}

function pStats(b){
  var T = (b.week && Array.isArray(b.week.tasks)) ? b.week.tasks : [];
  var arch = Array.isArray(b.archive) ? b.archive : [];
  var all = [...T, ...arch.flatMap(function(a){ return Array.isArray(a.tasks) ? a.tasks : []; })];
  var m = {};
  all.forEach(function(t){
    if(!t) return;
    var sn = t.sn || 'عام';
    var o = m[sn] = m[sn] || { d: 0, n: 0 };
    if(t.done) o.d++; else o.n++;
  });
  var e = Object.entries(m);
  var top = [...e].sort(function(a,c){ return c[1].d - a[1].d; })[0];
  var need = e.filter(function(x){ return x[1].n; }).sort(function(a,c){ return c[1].n - a[1].n; })[0];
  var mins = (Array.isArray(b.sessions) ? b.sessions : []).reduce(function(s,x){ return s + (x.m || 0); }, 0);
  var row = function(l,v){ return '<div class="card dh"><span>' + l + '</span><b>' + v + '</b></div>'; };
  return '<h2>📊 إحصائياتي</h2>'
    + row('نسبة إنجاز هذا الأسبوع', pct(T) + '%')
    + row('المهام المكتملة (هذا الأسبوع)', T.filter(function(t){ return t && t.done; }).length)
    + row('عدد جلسات الدراسة', (b.sessions || []).length)
    + row('مجموع وقت الدراسة', mins + ' دقيقة')
    + row('الأسابيع المستخدمة', arch.length + 1)
    + row('أكثر مادة أنجزت فيها', (top && top[1].d) ? esc(top[0]) : '—')
    + row('أكثر مادة تحتاج اهتمامًا', need ? esc(need[0]) : '—');
}

function calcFinalTable(cur, max){
  var resBox = $('#final_calc_res');
  if(!resBox) return;
  var finalMax = 100 - max;
  var targets = [
    {label: 'النجاح (50%)', score: 50},
    {label: 'متوسط (60%)', score: 60},
    {label: 'جيد (70%)', score: 70},
    {label: 'جيد جداً (80%)', score: 80},
    {label: 'امتياز (90%)', score: 90}
  ];
  var rows = targets.map(function(t){
    var needed = t.score - cur;
    var status = needed <= 0 ? 'مضمون بالفعل 🎉' : (needed > finalMax ? 'غير ممكن ❌' : (needed + ' من ' + finalMax));
    var color = needed <= 0 ? 'var(--success)' : (needed > finalMax ? 'var(--danger)' : 'var(--active)');
    return '<div class="card dh" style="padding:10px 14px;margin:5px 0"><span>' + t.label + '</span><b style="color:' + color + '">' + status + '</b></div>';
  }).join('');
  resBox.innerHTML = '<b style="display:block;margin-bottom:6px">🎯 ما تحتاجه في الامتحان النهائي (من ' + finalMax + '):</b>' + rows;
}

};

/* إدارة وقراءة ملفات وملازم المادة عبر IndexedDB */
var curSubDocsId = null;
A.openSubDocs = async function(d){
  curSubDocsId = d.id;
  var docs = await idbGetAll(d.id);
  var listHtml = docs.length ? docs.map(function(doc, idx){
    return '<div class="file-row">'
      + '<span class="fic">📖</span>'
      + '<span class="fn" data-a="viewDoc" data-docid="' + esc(doc.id) + '">' + esc(doc.name) + '<small class="fs">' + Math.round(doc.size/1024) + ' KB · اضغط للقراءة 👁</small></span>'
      + '<div class="file-ord">'
      + '<button data-a="moveDocUp" data-docid="' + esc(doc.id) + '" data-idx="' + idx + '" title="تقديم">▲</button>'
      + '<button data-a="moveDocDown" data-docid="' + esc(doc.id) + '" data-idx="' + idx + '" title="تأخير">▼</button>'
      + '</div>'
      + '<button class="st" data-a="delDoc" data-docid="' + esc(doc.id) + '" title="حذف">' + ic('trash') + '</button>'
      + '</div>';
  }).join('') : '<p class="mu card">لا توجد ملازم مرفوعة لهذه المادة حتى الآن.</p>';

  sheet('<h2>📁 ملازم ومستندات: ' + esc(d.name) + '</h2>'
    + '<p class="mu">ارفع ملازم PDF أو صوراً أو ملخصات واقرأها داخل التطبيق بدون إنترنت.</p>'
    + '<div style="max-height:50vh;overflow:auto;margin:10px 0">' + listHtml + '</div>'
    + '<button class="btn gold block" data-a="upDocTrigger">+ رفع ملزمة / ملف جديد للقراءة</button>');
};

A.viewDoc = async function(d){
  var db = await idb();
  var tx = db.transaction(DB_STORE, 'readonly');
  var req = tx.objectStore(DB_STORE).get(d.docid);
  req.onsuccess = function(){
    var doc = req.result;
    if(!doc) return toast('الملف غير موجود');
    var blob = doc.blob;
    if(!blob) return toast('تعذر فتح الملف');
    var url = URL.createObjectURL(blob);
    var type = (doc.type || '').toLowerCase();
    var isImg = type.startsWith('image/') || /\.(png|jpe?g|webp|gif|svg)$/i.test(doc.name);
    var isPdf = type.includes('pdf') || /\.pdf$/i.test(doc.name);
    var isTxt = type.includes('text') || /\.(txt|md|json)$/i.test(doc.name);

    if(isImg){
      sheet('<div class="dh" style="margin-bottom:8px">'
        + '<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%">📖 ' + esc(doc.name) + '</b>'
        + '<button class="btn ghost sm" data-a="close">✕ إغلاق</button>'
        + '</div>'
        + '<div style="overflow:auto;max-height:75vh;text-align:center;background:#000;border-radius:12px;padding:4px">'
        + '<img src="' + url + '" style="max-width:100%;height:auto;display:block;margin:auto" alt="' + esc(doc.name) + '">'
        + '</div>');
    } else if(isPdf){
      sheet('<div class="dh" style="margin-bottom:8px">'
        + '<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:75%">📖 ' + esc(doc.name) + '</b>'
        + '<button class="btn ghost sm" data-a="close">✕ إغلاق</button>'
        + '</div>'
        + '<div style="width:100%;height:70vh;border-radius:12px;overflow:hidden;background:#525659">'
        + '<iframe src="' + url + '#toolbar=1&navpanes=0" style="width:100%;height:100%;border:none;display:block"></iframe>'
        + '</div>'
        + '<div class="r2" style="margin-top:8px">'
        + '<button class="btn gold sm block" data-a="openExternalUrl" data-url="' + url + '">📖 قراءة بملء الشاشة ↗</button>'
        + '<button class="btn ghost sm block" data-a="dlDoc" data-docid="' + esc(doc.id) + '">تحميل نسخة ⬇</button>'
        + '</div>');
    } else if(isTxt){
      var reader = new FileReader();
      reader.onload = function(evt){
        sheet('<div class="dh" style="margin-bottom:8px"><b>📖 ' + esc(doc.name) + '</b><button class="btn ghost sm" data-a="close">✕ إغلاق</button></div>'
          + '<div style="max-height:72vh;overflow:auto;padding:12px;background:var(--surface2);border-radius:12px;white-space:pre-wrap;font-family:inherit;font-size:0.92rem;line-height:1.7">' + esc(evt.target.result) + '</div>');
      };
      reader.readAsText(blob);
    } else {
      sheet('<div style="text-align:center;padding:20px">'
        + '<div style="font-size:2.8rem;margin-bottom:8px">📄</div>'
        + '<b>' + esc(doc.name) + '</b>'
        + '<p class="mu">اضغط لفتح الملف وقراءته مباشرة في عارض الهاتف:</p>'
        + '<button class="btn gold block" data-a="openExternalUrl" data-url="' + url + '">📖 قراءة الملف الآن ↗</button>'
        + '</div>');
    }
  };
};

A.openExternalUrl = function(d){ window.open(d.url, '_blank'); };
A.upDocTrigger = function(){ $('#sub_doc_fi').click(); };
A.delDoc = async function(d){
  ask('هل أنت متأكد من حذف هذا الملف؟', 'حذف', async function(){
    await idbDel(d.docid);
    var sub = B().subjects.find(function(s){ return s.id === curSubDocsId; });
    if(sub){
      var docs = await idbGetAll(curSubDocsId);
      sub.docCount = docs.length;
      save();
    }
    closeSheet(); render(); toast('تم حذف الملف.');
  });
};
A.dlDoc = async function(d){
  var db = await idb();
  var tx = db.transaction(DB_STORE, 'readonly');
  var req = tx.objectStore(DB_STORE).get(d.docid);
  req.onsuccess = function(){
    var doc = req.result;
    if(!doc) return toast('الملف غير موجود');
    var url = URL.createObjectURL(doc.blob);
    var a = document.createElement('a');
    a.href = url; a.download = doc.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
  };
};

A.moveDocUp = async function(d){
  var docs = await idbGetAll(curSubDocsId);
  var idx = +d.idx;
  if(idx <= 0) return;
  var tmp = docs[idx]; docs[idx] = docs[idx-1]; docs[idx-1] = tmp;
  for(var i=0; i<docs.length; i++){ await idbPut(docs[i]); }
  A.openSubDocs({ id: curSubDocsId, name: '' });
};
A.moveDocDown = async function(d){
  var docs = await idbGetAll(curSubDocsId);
  var idx = +d.idx;
  if(idx >= docs.length - 1) return;
  var tmp = docs[idx]; docs[idx] = docs[idx+1]; docs[idx+1] = tmp;
  for(var i=0; i<docs.length; i++){ await idbPut(docs[i]); }
  A.openSubDocs({ id: curSubDocsId, name: '' });
};

/* جدول المحاضرات */
A.upTT = function(){ $('#tt_fi').click(); };
A.viewTT = function(){

A.addEx = function(){ exSheet(); }; A.openEx = function(d){ exSheet(d.id); };
A.saveEx = function(d){
  var s = val('x_s'), dt = $('#x_d').value;
  if(!s || !dt) return toast('اكتب المادة واختر التاريخ');
  var b = B();
  var o = { sname: s, type: $('#x_t').value, date: dt, time: $('#x_m').value, place: val('x_p'), note: val('x_n') };
  if(d.id){ Object.assign(b.exams.find(function(x){ return x && x.id === d.id; }), o); save(); closeSheet(); render(); }
  else { var e = Object.assign({ id: uid(), post: false, ch: [], tasks: [] }, o); b.exams.push(e); save(); render(); exSheet(e.id); }
  toast('تم حفظ الامتحان ✓');
};
var ex = function(id){ return B().exams.find(function(x){ return x && x.id === id; }); };
A.exAdd = function(d){ var t = val('a_' + d.k); if(!t) return; var item = ex(d.id); if(!item) return; item[d.k] = item[d.k] || []; item[d.k].push({ t: t, done: false }); save(); exSheet(d.id); render(); };
A.exTog = function(d){ var item = ex(d.id); if(!item || !item[d.k] || !item[d.k][+d.i]) return; item[d.k][+d.i].done = !item[d.k][+d.i].done; save(); exSheet(d.id); render(); };
A.exDel = function(d){ var item = ex(d.id); if(!item || !item[d.k]) return; item[d.k].splice(+d.i, 1); save(); exSheet(d.id); render(); };
A.exPost = function(d){ var e = ex(d.id); if(!e) return; e.post = !e.post; save(); exSheet(d.id); render(); };
A.delEx = function(d){ ask('هل أنت متأكد من حذف هذا الامتحان؟\nلا يمكن التراجع عن هذه العملية.', 'حذف', function(){ var b = B(); b.exams = b.exams.filter(function(x){ return x && x.id !== d.id; }); save(); render(); toast('تم حذف الامتحان.'); }); };
A.delArch = function(d){ ask('هل أنت متأكد من حذف هذا الأسبوع؟\nلا يمكن التراجع عن هذه العملية.', 'حذف', function(){ var b = B(); b.archive = b.archive.filter(function(x){ return x && x.id !== d.id; }); save(); location.hash = '#arch'; render(); toast('تم حذف الأسبوع.'); }); };
A.delAll = function(){ ask('هل أنت متأكد من حذف كل الأسابيع المحفوظة؟\nلا يمكن التراجع عن هذه العملية.', 'حذف الكل', function(){ B().archive = []; save(); render(); toast('تم حذف المحفوظات.'); }); };

A.endWeek = function(){
  ask('سيتم حفظ إنجاز هذا الأسبوع في المحفوظات وبدء أسبوع جديد.', 'بدء أسبوع جديد', function(){
    var b = B();
    archive(b);
    var cur = wk(nowIQ());
    var carried = (b.week.tasks || []).filter(function(t){ return t && (!t.done || t.rec); });
    var incoming = (b.nextWeekTasks || []).map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); });
    b.nextWeekTasks = [];
    b.week = {
      start: cur,
      tasks: [...carried.map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); }), ...incoming],
      notes: {}
    };
    save(); render(); toast('تم بدء الأسبوع الجديد بنجاح ✓');
  }, false);
};

A.course = function(d){ S.settings.course = +d.n; rollover(B()); save(); render(); toast('تم التبديل إلى الكورس ' + (d.n == 1 ? 'الأول' : 'الثاني')); };
A.theme = function(){ S.settings.dark = document.documentElement.dataset.theme !== 'dark'; save(); applyTheme(); render(); };
A.exp = function(){ var u = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })), a = document.createElement('a'); a.href = u; a.download = 'daftari-backup-' + iso(nowIQ()) + '.json'; document.body.append(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 1500); toast('تم تصدير البيانات ✓'); };
A.imp = function(){ $('#fi').click(); };

function onb(){
  var o = $('#ob'), s = OB = OB || { i: 0, course: 1, year: '', n: 5, days: [0,1,2,3,4], subs: [] };
  o.hidden = false;
  var ch = function(a, l, on){ return '<button class="chip ' + (on ? 'on' : '') + '" ' + a + '><span>' + l + '</span></button>'; };
  var st = ['<h1>أهلًا بك في دفتري 👋</h1><p>جهّز أسبوعك الدراسي في دقيقة.</p>',
    '<h2>📚 الكورس الدراسي</h2><div class="chips">' + [1,2].map(function(n){ return ch('data-a="ob" data-k="course" data-v="' + n + '"', 'الكورس ' + (n === 1 ? 'الأول' : 'الثاني'), s.course === n); }).join('') + '</div><input id="o_y" placeholder="السنة الدراسية (اختياري) مثل 2026 – 2027" value="' + esc(s.year) + '">',
    '<h2>كم يوم دوام لديك؟</h2><div class="chips">' + [3,4,5,6,7].map(function(n){ return ch('data-a="ob" data-k="n" data-v="' + n + '"', n, s.n === n); }).join('') + '</div>',
    '<h2>اختر أيام الدوام</h2><div class="chips">' + DN.map(function(n,i){ return ch('data-a="ob" data-k="day" data-v="' + i + '"', n, s.days.includes(i)); }).join('') + '</div>',
    '<h2>أضف موادك</h2><div class="r2"><input id="o_s" placeholder="اسم المادة"><button class="btn gold" data-a="ob" data-k="sub">+</button></div><div class="chips">' + s.subs.map(function(n,i){ return ch('data-a="ob" data-k="rm" data-v="' + i + '"', esc(n) + ' ✕', 1); }).join('') + '</div>',
    '<h1>تم تجهيز دفتري بنجاح 🎉</h1>'];
  var logoSvg = $('header .logo') ? $('header .logo').outerHTML : '';
  o.innerHTML = '<div class="ob">' + logoSvg + st[s.i] + '<div class="r2"><button class="btn ghost" data-a="obSkip">تخطي</button><button class="btn" data-a="obNext">' + (s.i === 5 ? 'ابدأ' : 'التالي') + '</button></div></div>';
}
function obRead(){ var y = $('#o_y'); if(y) OB.year = y.value.trim(); var n = $('#o_s'); if(n && n.value.trim()){ OB.subs.push(n.value.trim()); n.value = ''; } }
A.ob = function(d){
  obRead(); var s = OB, v = d.v;
  if(d.k === 'course') s.course = +v;
  else if(d.k === 'n'){ s.n = +v; s.days = [0,1,2,3,4,5,6].slice(0, s.n); }
  else if(d.k === 'day'){ s.days = s.days.includes(+v) ? s.days.filter(function(x){ return x !== +v; }) : [...s.days, +v].sort(); s.n = s.days.length; }
  else if(d.k === 'rm') s.subs.splice(+v, 1);
  onb(); var i = $('#o_s'); if(i) i.focus();
};
function obDone(){
  obRead(); var s = OB; S.settings.course = s.course; S.settings.year = s.year;
  if(s.days.length) S.settings.days = s.days;
  S.settings.done = true;
  var b = B();
  s.subs.forEach(function(n){ b.subjects.push({ id: uid(), name: n, days: [...((S.settings && S.settings.days) || [])], yt: '', tg: '', lec: '', docCount: 0, maxAbs: 4, absences: 0, cards: [], golden: '' }); });
  OB = null; rollover(b); save(); location.hash = '#home'; render();
}
A.obNext = function(){ obRead(); if(OB.i < 5){ OB.i++; onb(); } else obDone(); };
A.obSkip = obDone;

function applyTheme(){
  var d = S.settings.dark ?? matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  var meta = $('meta[name=theme-color]');
  if(meta) meta.content = d ? '#082C21' : '#0F3D2E';
}

function tick(){
  if(!S || !S.settings || !S.settings.done) return;
  checkAlarmLoop();
  var clk = $('#live_iq_time');
  if(clk) clk.textContent = '🇮🇶 ' + getIraqTimeStr();
  if(rollover(B())){
    save();
    render();
  }
}

function boot(){
  try {
    load(); applyTheme();
    if(S.settings.done){ rollover(B()); save(); }
    render();
    
    document.addEventListener('click', function(e){
      initAudio();
      var el = e.target.closest('[data-a]');
      if(el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el);
    });
    
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target && e.target.id === 'alarm_ans'){
        A.submitAlarmAns();
      }
    });

    document.addEventListener('input', function(e){ if(e.target.id === 'q'){ F.q = e.target.value; $('#wl').innerHTML = weekList(B()); } });

    var ttInput = $('#tt_fi');
    if(ttInput){
      ttInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var canvas = document.createElement('canvas');
            var maxW = 1200, maxH = 1200;
            var w = img.width, h = img.height;
            if(w > maxW || h > maxH){
              if(w > h){ h = Math.round(h * maxW / w); w = maxW; }
              else { w = Math.round(w * maxH / h); h = maxH; }
            }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var base64 = canvas.toDataURL('image/jpeg', 0.8);
            var b = B();
            b.timetableImg = base64;
            if(save()){ closeSheet(); render(); toast('تم حفظ جدول المحاضرات بنجاح ✓'); }
            else { toast('تعذر الحفظ: مساحة التخزين ممتلئة'); }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        ttInput.value = '';
      });
    }

    var docInput = $('#sub_doc_fi');
    if(docInput){
      docInput.addEventListener('change', async function(e){
        var file = e.target.files && e.target.files[0];
        if(!file || !curSubDocsId) return;
        var docObj = {
          id: uid(),
          sid: curSubDocsId,
          name: file.name,
          size: file.size,
          type: file.type || 'application/octet-stream',
          blob: file,
          date: iso(nowIQ())
        };
        await idbPut(docObj);
        var sub = B().subjects.find(function(s){ return s.id === curSubDocsId; });
        if(sub){
          var docs = await idbGetAll(curSubDocsId);
          sub.docCount = docs.length;
          save();
        }
        toast('تم حفظ الملزمة بنجاح ✓');
        docInput.value = '';
        A.openSubDocs({ id: curSubDocsId, name: (sub ? sub.name : '') });
      });
    }

    document.addEventListener('change', function(e){
      var t = e.target, b = B();
      if(t.dataset.note){ b.week.notes = b.week.notes || {}; b.week.notes[t.dataset.note] = t.value; save(); toast('تم حفظ الملاحظة ✓'); }
      else if(t.id==='yr'){ S.settings.year = t.value.trim(); rollover(B()); save(); render(); toast('تم تحديث السنة الدراسية'); }
      else if(t.name === 'wd'){ var d = [...document.querySelectorAll('[name=wd]:checked')].map(function(x){ return +x.value; }); if(!d.length){ t.checked = true; return toast('اختر يوم دوام واحدًا على الأقل'); } S.settings.days = d; save(); }
      else if(t.id === 'gl'){ S.settings.goal = Math.min(100, Math.max(10, +t.value || 90)); save(); toast('تم حفظ الهدف ✓'); }
      else if(t.id === 'fi' && t.files[0]){
        var r = new FileReader();
        r.onload = function(){
          var o = null;
          try { o = JSON.parse(r.result); } catch(err){}
          if(!validate(o)) toast('الملف غير صالح — لم يتم تغيير بياناتك');
          else ask('سيتم استبدال بياناتك الحالية بالنسخة المستوردة.', 'استيراد', function(){ S = o; S.settings.done = true; rollover(B()); save(); applyTheme(); render(); toast('تم استيراد البيانات ✓'); }, false);
          t.value = '';
        };
        r.readAsText(t.files[0]);
      }
    });

    addEventListener('hashchange', function(){ closeSheet(); render(); scrollTo(0, 0); });
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });

    if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  } catch(err) {
    if(window.onerror) window.onerror(err.message, '', 0);
  }
}
if(typeof document !== 'undefined') boot();
</script>
