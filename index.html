<script>
window.onerror = function(msg, url, line) {
  var app = document.getElementById('app') || document.body;
  app.innerHTML = '<div style="background:#fff;color:#b91c1c;padding:20px;margin:20px;border-radius:14px;border:2px solid #b91c1c;direction:rtl;text-align:right;font-family:sans-serif;">'
    + '<h3 style="margin:0 0 10px">⚠️ تنبيه خطأ</h3>'
    + '<p style="font-family:monospace;background:#fef2f2;padding:10px;border-radius:8px">' + msg + '<br><b>السطر:</b> ' + line + '</p>'
    + '<button onclick="localStorage.clear();location.reload(true);" style="padding:10px 16px;background:#0F3D2E;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">إعادة ضبط الذاكرة والتشغيل</button>'
    + '</div>';

};

<style>
:root{--primary:#0F3D2E;--primary-dark:#082C21;--primary-light:#176B4D;--gold:#D4AF37;--gold-light:#E6C766;--bg:#F5F7F5;--surface:#fff;--surface2:#EBF1ED;--border:#DDE5E0;--text:#12201A;--text-secondary:#64736C;--text-muted:#8A9690;--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#2563EB;--exam:#7C3AED;--btn:#0F3D2E;--active:#176B4D;--shadow:0 2px 10px rgba(8,44,33,.07)}
[data-theme=dark]{--bg:#071A14;--surface:#0D2A20;--surface2:#12372A;--border:#1C4A39;--text:#F4F7F5;--text-secondary:#AABAB2;--text-muted:#8FA198;--btn:#2A8C68;--active:#2A8C68;--shadow:none}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:calc(78px + env(safe-area-inset-bottom));position:relative;min-height:100vh}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
[data-theme=dark] header{background:var(--primary-dark)}
header a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px}header .g{margin-inline-start:auto;color:var(--gold-light);padding:8px}
.logo{width:38px;height:38px;flex:none}header b{display:block;font-size:1.05rem;line-height:1.2}header small{opacity:.8;font-size:.75rem}
main{max-width:640px;margin:0 auto;padding:6px 16px 16px;position:relative;z-index:1}
h1{font-size:1.5rem;margin:14px 0 4px}h2{font-size:1rem;margin:18px 0 8px}h3{font-size:.9rem;color:var(--active);margin:10px 0 4px}
small,.mu{color:var(--text-secondary);font-size:.82rem}p.mu{margin:6px 0}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
button.card{width:100%;text-align:start;font:inherit;cursor:pointer}.card.ex span,.card.ex small{display:block}
.hero{border-top:3px solid var(--gold)}.warn{border-color:var(--warning)}.now{border-color:var(--gold)}.now b{display:block;font-size:1.05rem}
.big{font-size:2.2rem;font-weight:800;color:var(--active);line-height:1.2}
.pb{height:10px;border-radius:9px;background:var(--border);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--primary-light),var(--gold));transition:width .3s}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--text-secondary)}.st4 b{display:block;font-size:1.15rem;color:var(--text)}
.ic{width:22px;height:22px;flex:none}
.btn{border:0;border-radius:14px;padding:11px 18px;min-height:46px;font:inherit;font-weight:700;background:var(--btn);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin:4px 0}
.btn:hover{background:var(--primary-light)}.btn.gold{background:var(--gold);color:var(--primary-dark)}.btn.gold:hover{background:var(--gold-light)}
.btn.danger{background:var(--danger)}.btn.ghost{background:var(--surface2);color:var(--text)}.btn.block{display:flex;width:100%}.btn.sm{min-height:34px;padding:4px 12px;font-size:.82rem}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r2:has(input){grid-template-columns:1fr auto}.r2 input[type=date]{grid-column:auto}.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:46px;margin:3px 0}
textarea{min-height:64px;resize:vertical}input[type=checkbox]{width:auto;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.chip{border:0;background:none;padding:0;font:inherit;color:var(--text);position:relative}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.chip input{position:absolute;opacity:0}.chip input:checked+span,.chip.on span{background:var(--btn);color:#fff;border-color:var(--btn)}.chip input:focus-visible+span{outline:2px solid var(--gold)}
.chk{display:flex;gap:8px;align-items:center;min-height:40px}
.task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 10px;margin:6px 0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--active);background:none;color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.done .ck{background:var(--success);border-color:var(--success)}.done b{text-decoration:line-through;color:var(--text-muted)}
.tb{flex:1;text-align:start;background:none;border:0;font:inherit;color:inherit;cursor:pointer;display:block}.tb b{display:block}.tb small{display:block}
.st{background:none;border:0;color:var(--text-muted);padding:6px;cursor:pointer}.st.on{color:var(--gold)}.st.on svg{fill:var(--gold)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav a{flex:1;display:grid;justify-items:center;gap:1px;padding:8px 0 6px;font-size:.7rem;color:var(--text-secondary);text-decoration:none}nav a[aria-current]{color:var(--active);font-weight:700}nav a[aria-current] svg{color:var(--gold)}
#sh{position:fixed;inset:0;z-index:20}#sh[hidden],#ob[hidden]{display:none}#sh .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sh .sb{position:absolute;bottom:0;inset-inline:0;max-width:640px;margin:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
#sh .sb>*{margin-bottom:6px}.msg{font-size:1.02rem;white-space:pre-line}
#ob{position:fixed;inset:0;z-index:30;background:var(--primary-dark);color:#fff;display:grid;place-items:center;padding:20px;overflow:auto}.ob{width:100%;max-width:440px}.ob .logo{width:64px;height:64px}.ob p{opacity:.85;margin-bottom:12px}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));inset-inline:0;z-index:40;display:grid;justify-items:center;gap:6px;pointer-events:none}
#toasts div{background:var(--primary-dark);color:#fff;border:1px solid var(--gold);border-radius:14px;padding:10px 16px;font-size:.9rem;max-width:90%}
.ft{text-align:center;margin:22px 0 4px;color:var(--text-secondary);font-size:.82rem}.cr{display:flex;justify-content:center;gap:6px;align-items:center;margin:14px 0 0;font-size:.78rem;color:var(--text-muted)}
.cr a{color:var(--active);text-decoration:none;display:inline-flex;gap:5px;align-items:center}.cr svg{width:14px;height:14px}
summary{list-style:none;user-select:none}summary::-webkit-details-marker{display:none}

.link-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.link-card{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);text-decoration:none;color:inherit}
.link-thumb{width:56px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;background:#000;color:#fff;overflow:hidden}
.link-thumb img{width:100%;height:100%;object-fit:cover}
.link-thumb.yt{background:#CC0000}
.link-thumb.tg{background:#229ED9}
.link-thumb.drive{background:#10B981}
.link-info{flex:1;min-width:0}
.link-badge{font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:6px;display:inline-block;margin-bottom:2px}
.badge-yt{background:rgba(204,0,0,.15);color:#CC0000}
.badge-tg{background:rgba(34,158,217,.15);color:#0284c7}
.badge-drive{background:rgba(16,185,129,.15);color:#059669}
.link-info b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-info small{display:block;font-size:.72rem;color:var(--text-secondary)}

.tt-box{border:2px dashed var(--gold);background:var(--surface);border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.tt-preview{position:relative;border-radius:14px;overflow:hidden;background:#06140f;cursor:pointer;max-height:160px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.tt-preview img{width:100%;height:auto;max-height:160px;object-fit:cover;opacity:0.85}
.tt-overlay{position:absolute;background:rgba(8,44,33,0.88);color:#fff;padding:6px 14px;border-radius:20px;font-size:0.82rem;font-weight:bold;border:1px solid var(--gold);display:flex;align-items:center;gap:6px}

/* ===== أنيميشن وتوهج الخلفية الهادئ وغير المزعج ===== */
.bg-ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow-orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:.12;will-change:transform}
[data-theme=dark] .glow-orb{opacity:.18}
.orb-1{width:320px;height:320px;background:var(--gold);top:-80px;left:-60px;animation:floatA 24s ease-in-out infinite alternate}
.orb-2{width:360px;height:360px;background:var(--primary-light);bottom:-100px;right:-80px;animation:floatB 28s ease-in-out infinite alternate}
.orb-3{width:220px;height:220px;background:var(--gold-light);top:50%;right:10%;animation:floatC 20s ease-in-out infinite alternate}

@keyframes floatA{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(60px,70px,0) scale(1.15)}
}
@keyframes floatB{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-60px,-50px,0) scale(1.18)}
}
@keyframes floatC{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-40px,40px,0) scale(0.92)}
}
@media (prefers-reduced-motion: reduce){.glow-orb{animation:none}}
</style>
</head>
<body>
<!-- توهجات الخلفية الانسيابية الهادئة -->
<div class="bg-ambient" aria-hidden="true">

  <div class="glow-orb orb-2"></div>

</div>

<header><a href="#home"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#082C21"/><path d="M10 14h11a3 3 0 013 3v17a3 3 0 00-3-3H10zM38 14H27a3 3 0 00-3 3v17a3 3 0 013-3h11z" fill="none" stroke="#D4AF37" stroke-width="2.2" stroke-linejoin="round"/><path d="M17 23l3 3 6-7" fill="none" stroke="#E6C766" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>دفتري</b><small id="sub"></small></span></a><a class="g" href="#set" id="gear" aria-label="الإعدادات"></a></header>
<main id="app"></main>
<nav id="nav" aria-label="التنقل"></nav>
<div id="sh" hidden></div><div id="ob" hidden></div><div id="toasts" aria-live="polite"></div>
<input type="file" id="tt_fi" accept="image/*" hidden>

<script>
var DN = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var PR = {h:['🔴','عالية'],m:['🟡','متوسطة'],l:['🟢','منخفضة']};
var KEY = 'mds_v1', A = {}, S = null, R = 'home', F = {q:'', f:'all'}, OB = null;
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var uid = function(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); };

var iso = function(d){ var x = (d instanceof Date && !isNaN(d)) ? d : new Date(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
var pd = function(s){ if(!s || typeof s !== 'string') return new Date(); var p = s.split('-').map(Number); return new Date(p[0]||2026, (p[1]||1)-1, p[2]||1); };

var wk = function(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - x.getDay());
  return iso(x);
};
var addD = function(s, n){ var x = pd(s); x.setDate(x.getDate() + (Number(n)||0)); return iso(x); };
var fd = function(s){ if(!s) return ''; var x = pd(s); return x.getFullYear() + '/' + String(x.getMonth()+1).padStart(2,'0') + '/' + String(x.getDate()).padStart(2,'0'); };
var rng = function(s){ return fd(s) + ' — ' + fd(addD(s,6)); };
var pct = function(T){ return (Array.isArray(T) && T.length) ? Math.round(100 * T.filter(function(t){ return t && t.done; }).length / T.length) : 0; };
var pos = function(d){ return Number(d) || 0; };

var I = {home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',book:'M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11',exam:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',box:'M3 7h18v4H3zM5 11v9h14v-9M10 15h4',gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',check:'M5 12l5 5 9-10',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',edit:'M4 20h4L19 9l-4-4L4 16z'};
var ic = function(n){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (I[n]||'') + '"/></svg>'; };
var credit = '<div class="cr"><a href="https://instagram.com/5k50m" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>صنع بواسطة @5k50m</a></div>';
var prog = function(p){ return '<div class="pb" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>'; };

function getYTId(url){
  if(!url || typeof url !== 'string') return null;
  var match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
  return (match && match[2].length === 11) ? match[2] : null;
}
function getTgHandle(url){
  if(!url || typeof url !== 'string') return '';
  var m = url.match(/(?:t\.me|telegram\.me)\/([a-zA-Z0-9_+]+)/);
  return m ? ('@' + m[1]) : 'قناة التليكرام';
}

function renderLinkCards(s){
  if(!s) return '';
  var h = '';
  if(s.yt && typeof s.yt === 'string' && s.yt.trim()){
    var vid = getYTId(s.yt.trim());
    var thumb = vid ? '<img src="https://img.youtube.com/vi/' + vid + '/mqdefault.jpg" alt="YouTube Thumbnail">'
      : '<svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73z"/></svg>';
    h += '<a href="' + esc(s.yt) + '" target="_blank" rel="noopener" class="link-card">'
      + '<div class="link-thumb yt">' + thumb + '</div>'
      + '<div class="link-info">'
      + '<span class="link-badge badge-yt">YouTube 🎥</span>'
      + '<b>' + (vid ? 'شرح المادة / الفيديو' : 'قائمة تشغيل الشرح') + '</b>'
      + '<small>اضغط للمشاهدة ↗</small>'
      + '</div></a>';
  }
  if(s.tg && typeof s.tg === 'string' && s.tg.trim()){
    var handle = getTgHandle(s.tg.trim());
    var tgSvg = '<svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>';
    h += '<a href="' + esc(s.tg) + '" target="_blank" rel="noopener" class="link-card">'
      + '<div class="link-thumb tg">' + tgSvg + '</div>'
      + '<div class="link-info">'
      + '<span class="link-badge badge-tg">Telegram 📢</span>'
      + '<b>' + esc(handle) + '</b>'
      + '<small>قناة التليكرام للمادة ↗</small>'
      + '</div></a>';
  }
  if(s.lec && typeof s.lec === 'string' && s.lec.trim()){
    var driveSvg = '<svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>';
    h += '<a href="' + esc(s.lec) + '" target="_blank" rel="noopener" class="link-card">'
      + '<div class="link-thumb drive">' + driveSvg + '</div>'
      + '<div class="link-info">'
      + '<span class="link-badge badge-drive">ملازم / Drive 📁</span>'
      + '<b>ملفات ومحاضرات المادة</b>'
      + '<small>فتح الرابط ↗</small>'
      + '</div></a>';
  }
  return h ? ('<div class="link-grid">' + h + '</div>') : '';
}

function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
  if(!S || typeof S !== 'object' || !S.settings || !S.b){
    S = { v: 1, settings: { dark: null, days: [0,1,2,3,4], course: 1, year: '', ws: 0, goal: 90, done: false }, b: {} };
  }
  if(!Array.isArray(S.settings.days)) S.settings.days = [0,1,2,3,4];
  S.settings.ws = 0;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e) { if(typeof document !== 'undefined') toast('تعذّر الحفظ: مساحة التخزين ممتلئة'); return false; }
}
function B(){
  var k = (S.settings.year || '-') + '|' + S.settings.course;
  S.b = S.b || {};
  if(!S.b[k]) S.b[k] = { subjects: [], exams: [], archive: [], week: null, sessions: [], timetableImg: null };
  var b = S.b[k];
  b.subjects = Array.isArray(b.subjects) ? b.subjects : [];
  b.exams = Array.isArray(b.exams) ? b.exams : [];
  b.archive = Array.isArray(b.archive) ? b.archive : [];
  b.sessions = Array.isArray(b.sessions) ? b.sessions : [];
  return b;
}
function archive(b){
  var w = b.week;
  if(!w) return false;

function rollover(b){
  var cur = wk(new Date());
  if(!b.week){
    b.week = { start: cur, tasks: [], notes: {} };
    return true;
  }
  if(b.week.start !== cur){
    archive(b);
    var carried = (b.week.tasks || []).filter(function(t){ return t && (!t.done || t.rec); });
    b.week = {
      start: cur,
      tasks: carried.map(function(t){ return Object.assign({}, t, { id: uid(), done: false }); }),
      notes: {}

}

function nowTask(b){
  if(!b.week || !Array.isArray(b.week.tasks)) return null;
  var tp = new Date().getDay();

    var d = Number(t.day) || 0;
    var s = ({h:30, m:20, l:10}[t.pr] || 20) + (d === tp ? 100 : d < tp ? 80 - (tp - d) : 50 - (d - tp) * 5) - i / 100;
    if(s > bs){ bs = s; best = t; }
  });
  return best;
}

    var hash = location.hash.slice(1).split('/');
    R = hash[0] || 'home';
    var id = hash[1];
    if(!S.settings.done) return onb();
    $('#ob').hidden = true;
    var b = B();
    var P = {home:pHome, week:pWeek, subj:pSubj, exams:pExams, arch:pArch, set:pSet, stats:pStats}[R] || pHome;
    $('#app').innerHTML = P(b, id) + (R === 'set' ? '' : credit);
    $('#nav').innerHTML = [['home','الرئيسية','home'],['week','الأسبوع','cal'],['subj','المواد','book'],['exams','الامتحانات','exam'],['arch','المحفوظات','box']].map(function(item){
      return '<a href="#' + item[0] + '" ' + (R === item[0] ? 'aria-current="page"' : '') + '>' + ic(item[2]) + item[1] + '</a>';

var TM = {dur:25, left:1500, end:0, iv:0, brk:false};
var mmss = function(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
function timerSheet(){
  var b = B();
  sheet('<h2>⏱ جلسة دراسة</h2><div class="r4">' + [15,25,45,60].map(function(m){ return '<button class="btn ' + (TM.dur === m && !TM.brk ? 'gold' : 'ghost') + '" data-a="tmSet" data-m="' + m + '">' + m + '</button>'; }).join('') + '</div><div class="big" id="tm" style="text-align:center">' + mmss(TM.left) + '</div><p class="mu" style="text-align:center">' + (TM.brk ? 'استراحة · 5 دقائق' : 'دراسة · '+ TM.dur + ' دقيقة (ثم استراحة 5 دقائق)') + '</p><div class="r2"><button class="btn" data-a="tmGo">' + (TM.iv ? 'إيقاف مؤقت' : 'ابدأ') + '</button><button class="btn ghost" data-a="tmReset">إعادة</button></div><p class="mu">أُنجزت ' + b.sessions.length + ' جلسة · ' + b.sessions.reduce(function(s,x){ return s + (x.m || 0); }, 0) + ' دقيقة</p>');
}
function tmTick(){
  TM.left = Math.max(0, Math.round((TM.end - Date.now()) / 1000));
  var el = $('#tm');
  if(el) el.textContent = mmss(TM.left);
  if(TM.left > 0) return;
  clearInterval(TM.iv); TM.iv = 0;
  if(navigator.vibrate) navigator.vibrate(300);
  if(TM.brk){ TM.brk = false; TM.left = TM.dur * 60; toast('انتهت الاستراحة'); }
  else { B().sessions.push({ d: iso(new Date()), m: TM.dur }); save(); toast('أحسنت، انتهت جلسة الدراسة.'); TM.brk = true; TM.left = 300; }
  if(!$('#sh').hidden && el) timerSheet();
}

A.copyTask = function(d){ var b = B(), t = b.week.tasks.find(function(x){ return x && x.id === d.id; }); if(!t) return; b.week.tasks.push(Object.assign({}, t, { id: uid(), done: false })); save(); closeSheet(); render(); toast('تم نسخ المهمة ✓'); };

A.saveSub = function(d){
  var n = val('f_n');
  if(!n) return toast('اكتب اسم المادة');
  var yt = val('f_yt'), tg = val('f_tg'), lec = val('f_lec');
  var b = B(), days = [...document.querySelectorAll('[name=sd]:checked')].map(function(x){ return +x.value; });
  if(d.id){
    var s = b.subjects.find(function(x){ return x && x.id === d.id; });
    if(!s) return;
    s.name = n; s.days = days; s.yt = yt; s.tg = tg; s.lec = lec;
    if(b.week && Array.isArray(b.week.tasks)){
      b.week.tasks.forEach(function(t){ if(t && t.sid === s.id) t.sn = n; });
    }
  } else {
    b.subjects.push({ id: uid(), name: n, days: days, yt: yt, tg: tg, lec: lec });
  }
  save(); closeSheet(); render(); toast('تم حفظ المادة ✓');
};
A.delSub = function(d){
  var b = B(), s = b.subjects.find(function(x){ return x && x.id === d.id; });
  if(!s) return;
  var n = b.week.tasks.filter(function(t){ return t && t.sid === s.id; }).length;
  ask('حذف «' + esc(s.name) + '»؟' + (n ? ('\nسيتم حذف ' + n + ' مهام مرتبطة بها.') : '') + '\nالأسابيع المحفوظة لا تتأثر.', 'حذف', function(){
    b.subjects = b.subjects.filter(function(x){ return x && x.id !== s.id; });
    b.week.tasks = b.week.tasks.filter(function(t){ return t && t.sid !== s.id; });
    if(b.week.notes) delete b.week.notes[s.id];
    save(); render(); toast('تم حذف المادة.');

    '<h2>📚 الكورس الدراسي</h2><div class="chips">' + [1,2].map(function(n){ return ch('data-a="ob" data-k="course" data-v="' + n + '"', 'الكورس ' + (n === 1 ? 'الأول' : 'الثاني'), s.course === n); }).join('') + '</div><input id="o_y" placeholder="السنة الدراسية (اختياري) مثل 2026 – 2027" value="' + esc(s.year) + '">',

A.ob = function(d){
  obRead(); var s = OB, v = d.v;
  if(d.k === 'course') s.course = +v;
  else if(d.k === 'n'){ s.n = +v; s.days = [0,1,2,3,4,5,6].slice(0, s.n); }
  else if(d.k === 'day'){ s.days = s.days.includes(+v) ? s.days.filter(function(x){ return x !== +v; }) : [...s.days, +v].sort(); s.n = s.days.length; }
  else if(d.k === 'rm') s.subs.splice(+v, 1);
  onb(); var i = $('#o_s'); if(i) i.focus();
};
function obDone(){
  obRead(); var s = OB; S.settings.course = s.course; S.settings.year = s.year;
  if(s.days.length) S.settings.days = s.days;
  S.settings.done = true;
  var b = B();
  s.subs.forEach(function(n){ b.subjects.push({ id: uid(), name: n, days: [...((S.settings && S.settings.days) || [])], yt: '', tg: '', lec: '' }); });
  OB = null; rollover(b); save(); location.hash = '#home'; render();
}
A.obNext = function(){ obRead(); if(OB.i < 5){ OB.i++; onb(); } else obDone(); };
A.obSkip = obDone;

function applyTheme(){
  var d = S.settings.dark ?? matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  var meta = $('meta[name=theme-color]');
  if(meta) meta.content = d ? '#082C21' : '#0F3D2E';
}
function tick(){ if(!S.settings.done) return; if(rollover(B())) save(); if($('#sh').hidden && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); }

function boot(){
  try {
    load(); applyTheme();
    if(S.settings.done){ rollover(B()); save(); }
    render();
    document.addEventListener('click', function(e){ var el = e.target.closest('[data-a]'); if(el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el); });
    document.addEventListener('input', function(e){ if(e.target.id === 'q'){ F.q = e.target.value; $('#wl').innerHTML = weekList(B()); } });
    
    var ttInput = $('#tt_fi');
    if(ttInput){
      ttInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var canvas = document.createElement('canvas');
            var maxW = 1200, maxH = 1200;
            var w = img.width, h = img.height;
            if(w > maxW || h > maxH){
              if(w > h){ h = Math.round(h * maxW / w); w = maxW; }
              else { w = Math.round(w * maxH / h); h = maxH; }
            }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var base64 = canvas.toDataURL('image/jpeg', 0.8);
            var b = B();
            b.timetableImg = base64;
            if(save()){
              closeSheet();
              render();
              toast('تم حفظ جدول المحاضرات بنجاح ✓');
            } else {
              toast('تعذر الحفظ: حجم الصورة كبير جداً');
            }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        ttInput.value = '';
      });
    }

    document.addEventListener('change', function(e){
      var t = e.target, b = B();
      if(t.dataset.note){ b.week.notes = b.week.notes || {}; b.week.notes[t.dataset.note] = t.value; save(); toast('تم حفظ الملاحظة ✓'); }
      else if(t.id==='yr'){ S.settings.year = t.value.trim(); rollover(B()); save(); render(); toast('تم تحديث السنة الدراسية'); }
      else if(t.name === 'wd'){ var d = [...document.querySelectorAll('[name=wd]:checked')].map(function(x){ return +x.value; }); if(!d.length){ t.checked = true; return toast('اختر يوم دوام واحدًا على الأقل'); } S.settings.days = d; save(); }
      else if(t.id === 'gl'){ S.settings.goal = Math.min(100, Math.max(10, +t.value || 90)); save(); toast('تم حفظ الهدف ✓'); }
      else if(t.id === 'fi' && t.files[0]){
        var r = new FileReader();
        r.onload = function(){
          var o = null;
          try { o = JSON.parse(r.result); } catch(err){}
          if(!validate(o)) toast('الملف غير صالح — لم يتم تغيير بياناتك');
          else ask('سيتم استبدال بياناتك الحالية بالنسخة المستوردة.', 'استيراد', function(){ S = o; S.settings.done = true; rollover(B()); save(); applyTheme(); render(); toast('تم استيراد البيانات ✓'); }, false);
          t.value = '';
        };
        r.readAsText(t.files[0]);
      }
    });
    addEventListener('hashchange', function(){ closeSheet(); render(); scrollTo(0, 0); });
    setInterval(tick, 30000);
    document.addEventListener('visibilitychange', tick);
    if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js?v=11').catch(function(){});
    }
  } catch(err) {
    if(window.onerror) window.onerror(err.message, '', 0);
  }
}
if(typeof document !== 'undefined') boot();
</script>
</body>
