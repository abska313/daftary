<style>
:root{--primary:#0F3D2E;--primary-dark:#082C21;--primary-light:#176B4D;--gold:#D4AF37;--gold-light:#E6C766;--bg:#F5F7F5;--surface:#fff;--surface2:#EBF1ED;--border:#DDE5E0;--text:#12201A;--text-secondary:#64736C;--text-muted:#8A9690;--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#2563EB;--exam:#7C3AED;--btn:#0F3D2E;--active:#176B4D;--shadow:0 2px 10px rgba(8,44,33,.07)}

</style>

<script>
/* =========================================================
   أدوات عامة + توقيت العراق + مخزن IndexedDB للملفات
   ========================================================= */
var DN = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var PR = {h:['🔴','عالية'],m:['🟡','متوسطة'],l:['🟢','منخفضة']};
var KEY = 'mds_v1', A = {}, S = null, R = 'home', F = {q:'', f:'all'}, OB = null;
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var uid = function(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); };

/* ===== توقيت العراق (UTC+3 بدون توقيت صيفي) ===== */
function nowIQ(){
  var d = new Date();
  var localOff = d.getTimezoneOffset();
  var iraqOff = -180;
  var diff = (localOff - iraqOff) * 60000;
  return new Date(d.getTime() + diff);
}
var iso = function(d){ var x = (d instanceof Date && !isNaN(d)) ? d : nowIQ(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
var pd = function(s){ if(!s || typeof s !== 'string') return nowIQ(); var p = s.split('-').map(Number); return new Date(p[0]||2026, (p[1]||1)-1, p[2]||1); };
var wk = function(d){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return iso(x); };
var addD = function(s, n){ var x = pd(s); x.setDate(x.getDate() + (Number(n)||0)); return iso(x); };
var fd = function(s){ if(!s) return ''; var x = pd(s); return x.getFullYear() + '/' + String(x.getMonth()+1).padStart(2,'0') + '/' + String(x.getDate()).padStart(2,'0'); };
var rng = function(s){ return fd(s) + ' — ' + fd(addD(s,6)); };
var pct = function(T){ return (Array.isArray(T) && T.length) ? Math.round(100 * T.filter(function(t){ return t && t.done; }).length / T.length) : 0; };

var I = {home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',book:'M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11',exam:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',box:'M3 7h18v4H3zM5 11v9h14v-9M10 15h4',gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',check:'M5 12l5 5 9-10',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',edit:'M4 20h4L19 9l-4-4L4 16z',bell:'M18 8a6 6 0 00-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21a2 2 0 004 0',file:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6',clip:'M21 12.5l-8.5 8.5a5 5 0 01-7-7l8-8a3.5 3.5 0 015 5l-8 8a2 2 0 01-3-3l7-7'};
var ic = function(n){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (I[n]||'') + '"/></svg>'; };
var credit = '<div class="cr"><a href="https://instagram.com/5k50m" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>صنع بواسطة @5k50m</a></div>';
var prog = function(p){ return '<div class="pb" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>'; };

/* ========== IndexedDB للملفات ========== */
var DB_NAME = 'daftari_v1', DB_STORE = 'files';
var _dbPromise = null;
function idb(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(res, rej){
    if(!('indexedDB' in window)) return rej('no-idb');
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        var st = db.createObjectStore(DB_STORE, {keyPath: 'id'});
        st.createIndex('sid', 'sid', {unique: false});
      }
    };
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
  return _dbPromise;
}
function idbPut(rec){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put(rec); tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); }; }); }); }
function idbGetAll(sid){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readonly'); var req = tx.objectStore(DB_STORE).index('sid').getAll(sid); req.onsuccess = function(){ res(req.result || []); }; req.onerror = function(){ rej(req.error); }; }); }); }
function idbDel(id){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).delete(id); tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); }; }); }); }
function idbCount(sid){ return idbGetAll(sid).then(function(a){ return a.length; }); }

var FILE_CACHE = {};
function loadFiles(sid, cb){
  idbGetAll(sid).then(function(files){
    files.sort(function(a,c){ return (a.order||0) - (c.order||0); });
    FILE_CACHE[sid] = files;
    if(cb) cb(files);
  }).catch(function(){ FILE_CACHE[sid] = []; if(cb) cb([]); });
}
function dataURLtoBlob(dataUrl){
  var parts = dataUrl.split(','), mime = (parts[0].match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  var bin = atob(parts[1] || '');
  var arr = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function openFileRecord(rec){
  try {
    var blob = dataURLtoBlob(rec.data);
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');

  } catch(e){ toast('تعذر فتح الملف'); }
}
function fmtSize(b){
  if(!b) return '0 B';

}

function B(){

function archive(b){

  });

/* ========== مهام الأسبوع الحالي (تدعم جدولة أسابيع قادمة) ========== */
function weekTasks(b){
  if(!b.week) return [];
  var cur = b.week.start;
  return (b.week.tasks || []).filter(function(t){
    return t && (t.ws || cur) === cur;
  });
}
function rollover(b){
  var cur = wk(nowIQ());
  if(!b.week){
    b.week = { start: cur, tasks: [], notes: {} };
    return true;
  }
  if(b.week.start !== cur){
    archive(b);
    // احتفظ بالمهام المجدولة لأسابيع قادمة + المتكررة غير المنجزة
    var kept = (b.week.tasks || []).filter(function(t){
      if(!t) return false;
      var tws = t.ws || b.week.start;
      if(tws > cur) return true;
      if(t.rec && !t.done) return true;
      return false;
    });
    b.week = {
      start: cur,
      tasks: kept.map(function(t){
        var tws = t.ws || b.week.start;
        if(tws > cur) return t;
        return Object.assign({}, t, { id: uid(), done: false, ws: cur });
      }),
      notes: {}
    };
    return true;
  }
  return false;
}

function nowTask(b){
  var list = weekTasks(b).filter(function(t){ return !t.done; });
  if(!list.length) return null;
  var tp = nowIQ().getDay();
  var best = null, bs = -1e9;
  list.forEach(function(t, i){
    var d = Number(t.day) || 0;
    var s = ({h:30, m:20, l:10}[t.pr] || 20) + (d === tp ? 100 : d < tp ? 80 - (tp - d) : 50 - (d - tp) * 5) - i / 100;
    if(s > bs){ bs = s; best = t; }
  });
  return best;
}

var examT = function(e){
  var dp = (e.date||'').split('-').map(Number);

  // أنشئ لحظة UTC تقابل ذلك التوقيت في العراق (UTC+3)
  return new Date(Date.UTC(dp[0]||2026, (dp[1]||1)-1, dp[2]||1, tp[0]||0, tp[1]||0) - 3*3600000);
};
var ready = function(e){
  var a = [...(e && Array.isArray(e.ch) ? e.ch : []), ...(e && Array.isArray(e.tasks) ? e.tasks : [])];
  return a.length ? Math.round(100 * a.filter(function(x){ return x && x.done; }).length / a.length) : 0;
};
var ST = {soon:['🟡','قادم'], today:['🔵','اليوم'], done:['🟢','مكتمل'], post:['⚪','مؤجل']};
var exState = function(e){ var t = iso(nowIQ()); return e.post ? 'post' : e.date < t ? 'done' : e.date === t ? 'today' : 'soon'; };
function cd(e){
  var ms = examT(e) - Date.now();
  if(ms <= 0) return 'اليوم';
  var d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
  return d ? (d + ' يوم و ' + h + ' ساعة') : (h + ' ساعة و ' + Math.floor(ms % 36e5 / 6e4) + ' دقيقة');
}

function dayBlocks(tasks, ro, startIso){

var currentFilesSid = null;
function fileSheet(sid){

    + '<div id="flist"><p class="mu" style="text-align:center;font-size:.82rem">جاري التحميل…</p></div>'

  var dz = $('#dz');
  if(dz){
    dz.addEventListener('click', function(){ pickFilesFor(sid); });
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('hover'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('hover'); });
    dz.addEventListener('drop', function(e){
      e.preventDefault(); dz.classList.remove('hover');
      if(e.dataTransfer && e.dataTransfer.files) uploadFiles(sid, e.dataTransfer.files);
    });
  }
  renderFileList(sid);
}
function renderFileList(sid){
  var box = $('#flist');
  if(!box) return;
  loadFiles(sid, function(files){
    if(!$('#flist')) return;
    if(!files.length){
      $('#flist').innerHTML = '<p class="mu" style="text-align:center;font-size:.82rem;padding:12px">لا توجد ملفات بعد.</p>';
      return;
    }
    $('#flist').innerHTML = files.map(function(f, i){
      var ext = (f.name.split('.').pop() || '').toUpperCase().slice(0,4);
      return '<div class="file-row" draggable="true" data-fid="' + esc(f.id) + '" data-sid="' + esc(sid) + '">'
        + '<span class="fh" title="اسحب">≡</span>'
        + '<span class="fic">' + esc(ext) + '</span>'
        + '<span class="fn" data-a="openFile" data-fid="' + esc(f.id) + '"><b>' + esc(f.name) + '</b><small class="fs">' + fmtSize(f.size) + '</small></span>'
        + '<div class="file-ord"><button data-a="moveFileUp" data-fid="' + esc(f.id) + '" aria-label="أعلى">▲</button><button data-a="moveFileDown" data-fid="' + esc(f.id) + '" aria-label="أسفل">▼</button></div>'
        + '<button class="fa" data-a="delFile" data-fid="' + esc(f.id) + '" aria-label="حذف">🗑</button>'
        + '</div>';
    }).join('');
    bindFileDrag(sid);
  });
}
function bindFileDrag(sid){
  var rows = document.querySelectorAll('#flist .file-row');
  var dragSrc = null;
  rows.forEach(function(r){
    r.addEventListener('dragstart', function(e){ dragSrc = r; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    r.addEventListener('dragend', function(){ r.classList.remove('dragging'); rows.forEach(function(x){ x.classList.remove('drag-over'); }); });
    r.addEventListener('dragover', function(e){ e.preventDefault(); if(dragSrc && dragSrc !== r){ r.classList.add('drag-over'); } });
    r.addEventListener('dragleave', function(){ r.classList.remove('drag-over'); });
    r.addEventListener('drop', function(e){
      e.preventDefault(); r.classList.remove('drag-over');
      if(!dragSrc || dragSrc === r) return;
      var list = Array.from(document.querySelectorAll('#flist .file-row'));
      var from = list.indexOf(dragSrc), to = list.indexOf(r);
      if(from < 0 || to < 0) return;
      var arr = (FILE_CACHE[sid] || []).slice();
      var moved = arr.splice(from, 1)[0];
      arr.splice(to, 0, moved);
      arr.forEach(function(f, i){ f.order = i; idbPut(f); });
      FILE_CACHE[sid] = arr;
      renderFileList(sid);
    });
  });
}
function pickFilesFor(sid){
  var inp = $('#sub_fi');
  inp.value = '';
  inp.onchange = function(){ if(inp.files && inp.files.length) uploadFiles(sid, inp.files); };
  inp.click();
}
function uploadFiles(sid, files){
  var arr = Array.from(files);
  if(!arr.length) return;
  toast('جاري رفع ' + arr.length + ' ملف…');
  var results = [];
  var i = 0;
  function next(){
    if(i >= arr.length) return done();
    var f = arr[i++];
    var r = new FileReader();
    r.onload = function(){ results.push({name: f.name, type: f.type || 'application/octet-stream', size: f.size, data: r.result}); next(); };
    r.onerror = function(){ next(); };
    r.readAsDataURL(f);
  }
  function done(){
    var startOrder = (FILE_CACHE[sid] || []).length;
    Promise.all(results.map(function(x, idx){
      return idbPut({ id: uid(), sid: sid, name: x.name, type: x.type, size: x.size, data: x.data, order: startOrder + idx, createdAt: Date.now() });
    })).then(function(){

var alarmActive = false;
var alarmCtx = null, alarmOsc = null, alarmGain = null, alarmPulse = null;

function startAlarmSound(){
  try {
    stopAlarmSound();
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    alarmCtx = new AC();
    alarmOsc = alarmCtx.createOscillator();
    alarmGain = alarmCtx.createGain();
    alarmOsc.type = 'sine';
    alarmOsc.frequency.value = 880;
    alarmGain.gain.value = 0.05;
    alarmOsc.connect(alarmGain).connect(alarmCtx.destination);
    alarmOsc.start();
    var up = true;
    alarmPulse = setInterval(function(){
      if(!alarmCtx) return;
      try {
        alarmGain.gain.linearRampToValueAtTime(up ? 0.35 : 0.05, alarmCtx.currentTime + 0.25);
        alarmOsc.frequency.setValueAtTime(up ? 880 : 660, alarmCtx.currentTime);
      } catch(e){}
      up = !up;
    }, 350);
  } catch(e){ console.error(e); }
}
function stopAlarmSound(){
  try { if(alarmPulse) clearInterval(alarmPulse); alarmPulse = null; } catch(e){}
  try { if(alarmOsc) alarmOsc.stop(); alarmOsc = null; } catch(e){}
  try { if(alarmCtx) alarmCtx.close(); alarmCtx = null; } catch(e){}
}
function alarmSheet(a){
  var x = Math.floor(Math.random()*8) + 3;
  var y = Math.floor(Math.random()*8) + 3;
  var z = Math.floor(Math.random()*20) + 5;
  var ans = x * y + z;
  alarmActive = true;
  sheet('<div class="alarm-ring">'
    + '<div class="clock">⏰</div>'
    + '<h2>' + esc(a.label || 'منبه دفتري') + '</h2>'
    + '<p class="alarm-time">الوقت: ' + esc(a.time) + ' بتوقيت العراق</p>'
    + '<p style="margin-top:10px">لإيقاف المنبه، حل المعادلة التالية:</p>'
    + '<div class="alarm-math">' + x + ' × ' + y + ' + ' + z + ' = ?</div>'
    + '<input id="alarm_ans" type="number" inputmode="numeric" placeholder="الإجابة" autocomplete="off" style="text-align:center;font-size:1.4rem;font-weight:800;letter-spacing:2px">'
    + '<button class="btn gold block" data-a="alarmSubmit" data-ans="' + ans + '" style="margin-top:10px">تحقق وإيقاف</button>'
    + '<p class="mu" style="margin-top:8px;font-size:.75rem">اكتب الإجابة الصحيحة لإيقاف المنبه.</p>'
    + '</div>', true);
  setTimeout(function(){ var el = $('#alarm_ans'); if(el) el.focus(); }, 100);
}
function fireAlarm(a){
  startAlarmSound();
  try {
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      var n = new Notification('⏰ دفتري', { body: (a.label || 'حان وقت المنبه') + ' — ' + a.time, tag: 'daftari-alarm', requireInteraction: true });
      n.onclick = function(){ window.focus(); n.close(); };
    }
  } catch(e){}
  alarmSheet(a);
  window.addEventListener('beforeunload', alarmBeforeUnload);
}
function alarmBeforeUnload(e){ if(alarmActive){ e.preventDefault(); e.returnValue = ''; return ''; } }

function checkAlarms(){
  if(!Array.isArray(S.alarms)) return;
  if(alarmActive) return;
  var n = nowIQ();
  var hh = String(n.getHours()).padStart(2,'0');
  var mm = String(n.getMinutes()).padStart(2,'0');
  var cur = hh + ':' + mm;
  var today = iso(n);
  for(var i = 0; i < S.alarms.length; i++){
    var a = S.alarms[i];
    if(!a || !a.on) continue;
    if(a.time !== cur) continue;
    if(a.lastFired === today + 'T' + cur) continue;
    if(Array.isArray(a.days) && a.days.length && a.days.indexOf(n.getDay()) === -1) continue;
    a.lastFired = today + 'T' + cur;
    save();
    fireAlarm(a);
    return;
  }
}

  sheet('<div class="dh" style="margin-bottom:10px"><b>🎬 المشاهدة داخل الموقع</b><button class="btn ghost sm" data-a="close">✕ إغلاق</button></div>'
    + '<div class="yt-embed"><iframe src="' + esc(d.embed) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'
    + '<p class="mu" style="font-size:.75rem;margin-top:8px">ℹ️ لتخزين المشاهدة في سجلك، افتح الرابط من يوتيوب مباشرة.</p>');
};

/* المنبهات */
A.addAlarm = function(){
  var hh = nowIQ();
  var def = String(hh.getHours()).padStart(2,'0') + ':' + String((hh.getMinutes()+5)%60).padStart(2,'0');
  sheet('<h2>⏰ منبه جديد</h2>'
    + '<label class="mu" style="font-size:.82rem">الوقت (بتوقيت العراق)</label>'
    + '<input id="al_t" type="time" value="' + def + '">'
    + '<label class="mu" style="font-size:.82rem;margin-top:8px;display:block">الوصف</label>'
    + '<input id="al_l" placeholder="مثال: مراجعة الرياضيات">'
    + '<p class="mu" style="margin-top:10px;font-weight:700">أيام التكرار (اتركها فارغة لكل يوم)</p>'
    + '<div class="chips">' + DN.map(function(n,i){ return '<label class="chip"><input type="checkbox" name="ald" value="' + i + '"><span>' + n + '</span></label>'; }).join('') + '</div>'
    + '<button class="btn block" data-a="saveAlarm">حفظ المنبه</button>'
    + '<p class="mu" style="font-size:.75rem;margin-top:6px">ℹ️ سيرن المنبه داخل التطبيق مع صوت وإشعار. لإيقافه عليك حل معادلة رياضية بسيطة.</p>'
  );
};
A.saveAlarm = function(){
  var t = val('al_t');
  if(!t) return toast('اختر وقت المنبه');
  var l = val('al_l');
  var days = [...document.querySelectorAll('[name=ald]:checked')].map(function(x){ return +x.value; });
  S.alarms.push({ id: uid(), time: t, label: l, days: days, on: true, lastFired: null });
  save(); closeSheet(); render();
  toast('تم إضافة المنبه ✓');
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    Notification.requestPermission().catch(function(){});
  }
};
A.delAlarm = function(d){
  ask('حذف هذا المنبه؟', 'حذف', function(){
    S.alarms = S.alarms.filter(function(x){ return x && x.id !== d.id; });
    save(); render(); toast('تم حذف المنبه.');
  });
};
A.togAlarm = function(d, el){
  var a = S.alarms.find(function(x){ return x && x.id === d.id; });
  if(!a) return;
  a.on = !a.on; save(); render();
};
A.reqNotif = function(){
  if(typeof Notification === 'undefined') return toast('الإشعارات غير مدعومة على هذا الجهاز');
  Notification.requestPermission().then(function(p){
    if(p === 'granted'){ toast('تم تفعيل الإشعارات ✓'); render(); }
    else toast('لم يتم منح الإذن');
  });
};
A.alarmSubmit = function(d){
  var v = parseInt(val('alarm_ans'), 10);
  if(v === +d.ans){
    stopAlarmSound();
    alarmActive = false;
    closeSheet();
    window.removeEventListener('beforeunload', alarmBeforeUnload);
    toast('تم إيقاف المنبه ✓');
  } else {
    toast('إجابة خاطئة، حاول مرة أخرى');
    var inp = $('#alarm_ans');
    if(inp){ inp.value = ''; inp.focus(); }
  }
};

/* الإعدادات */
A.course = function(d){ S.settings.course = +d.n; rollover(B()); save(); render(); toast('تم التبديل إلى الكورس ' + (d.n == 1 ? 'الأول' : 'الثاني')); };
A.theme = function(){ S.settings.dark = document.documentElement.dataset.theme !== 'dark'; save(); applyTheme(); render(); };
A.exp = function(){ var u = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })), a = document.createElement('a'); a.href = u; a.download = 'daftari-backup-' + iso(nowIQ()) + '.json'; document.body.append(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 1500); toast('تم تصدير البيانات ✓'); };
A.imp = function(){ $('#fi').click(); };
A.timer = timerSheet;
A.tmSet = function(d){ if(TM.iv) return toast('أوقف المؤقت أولًا'); TM.dur = +d.m; TM.brk = false; TM.left = TM.dur * 60; timerSheet(); };
A.tmGo = function(){ if(TM.iv){ clearInterval(TM.iv); TM.iv = 0; tmTick(); } else { TM.end = Date.now() + TM.left * 1000; TM.iv = setInterval(tmTick, 500); } timerSheet(); };
A.tmReset = function(){ clearInterval(TM.iv); TM.iv = 0; TM.brk = false; TM.left = TM.dur * 60; timerSheet(); };

/* =========================================================
   Onboarding
   ========================================================= */
function onb(){
  var o = $('#ob'), s = OB = OB || { i: 0, course: 1, year: '', n: 5, days: [0,1,2,3,4], subs: [] };
  o.hidden = false;
  var ch = function(a, l, on){ return '<button class="chip ' + (on ? 'on' : '') + '" ' + a + '><span>' + l + '</span></button>'; };
  var st = ['<h1>أهلًا بك في دفتري 👋</h1><p>جهّز أسبوعك الدراسي في دقيقة.</p>',
    '<h2>📚 الكورس الدراسي</h2><div class="chips">' + [1,2].map(function(n){ return ch('data-a="ob" data-k="course" data-v="' + n + '"', 'الكورس ' + (n === 1 ? 'الأول' : 'الثاني'), s.course === n); }).join('') + '</div><input id="o_y" placeholder="السنة الدراسية (اختياري) مثل 2026 – 2027" value="' + esc(s.year) + '">',
    '<h2>كم يوم دوام لديك؟</h2><div class="chips">' + [3,4,5,6,7].map(function(n){ return ch('data-a="ob" data-k="n" data-v="' + n + '"', n, s.n === n); }).join('') + '</div>',
    '<h2>اختر أيام الدوام</h2><div class="chips">' + DN.map(function(n,i){ return ch('data-a="ob" data-k="day" data-v="' + i + '"', n, s.days.includes(i)); }).join('') + '</div>',
    '<h2>أضف موادك</h2><div class="r2"><input id="o_s" placeholder="اسم المادة"><button class="btn gold" data-a="ob" data-k="sub">+</button></div><div class="chips">' + s.subs.map(function(n,i){ return ch('data-a="ob" data-k="rm" data-v="' + i + '"', esc(n) + ' ✕', 1); }).join('') + '</div>',
    '<h1>تم تجهيز دفتري بنجاح 🎉</h1>'];
  var logoSvg = $('header .logo') ? $('header .logo').outerHTML : '';
  o.innerHTML = '<div class="ob">' + logoSvg + st[s.i] + '<div class="r2"><button class="btn ghost" data-a="obSkip">تخطي</button><button class="btn" data-a="obNext">' + (s.i === 5 ? 'ابدأ' : 'التالي') + '</button></div></div>';
}
function obRead(){ var y = $('#o_y'); if(y) OB.year = y.value.trim(); var n = $('#o_s'); if(n && n.value.trim()){ OB.subs.push(n.value.trim()); n.value = ''; } }
A.ob = function(d){
  obRead(); var s = OB, v = d.v;
  if(d.k === 'course') s.course = +v;
  else if(d.k === 'n'){ s.n = +v; s.days = [0,1,2,3,4,5,6].slice(0, s.n); }
  else if(d.k === 'day'){ s.days = s.days.includes(+v) ? s.days.filter(function(x){ return x !== +v; }) : [...s.days, +v].sort(); s.n = s.days.length; }
  else if(d.k === 'rm') s.subs.splice(+v, 1);
  onb(); var i = $('#o_s'); if(i) i.focus();
};
function obDone(){
  obRead(); var s = OB; S.settings.course = s.course; S.settings.year = s.year;
  if(s.days.length) S.settings.days = s.days;
  S.settings.done = true;
  var b = B();
  s.subs.forEach(function(n){ b.subjects.push({ id: uid(), name: n, days: [...((S.settings && S.settings.days) || [])], yt: '', tg: '', lec: '' }); });
  OB = null; rollover(b); save(); location.hash = '#home'; render();
}
A.obNext = function(){ obRead(); if(OB.i < 5){ OB.i++; onb(); } else obDone(); };
A.obSkip = obDone;

/* =========================================================
   الثيم والتشغيل
   ========================================================= */
function applyTheme(){
  var d = S.settings.dark ?? matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme = d ? 'dark' : 'light';
  var meta = $('meta[name=theme-color]');
  if(meta) meta.content = d ? '#082C21' : '#0F3D2E';
}
function tick(){
  if(!S.settings.done) return;
  checkAlarms();
  if(rollover(B())) save();
  if($('#sh').hidden && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
}

function boot(){
  try {
    load(); applyTheme();
    if(S.settings.done){ rollover(B()); save(); }
    render();
    document.addEventListener('click', function(e){ var el = e.target.closest('[data-a]'); if(el && A[el.dataset.a]) A[el.dataset.a](el.dataset, el); });
    document.addEventListener('input', function(e){ if(e.target.id === 'q'){ F.q = e.target.value; $('#wl').innerHTML = weekList(B()); } });

    var ttInput = $('#tt_fi');
    if(ttInput){
      ttInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var canvas = document.createElement('canvas');
            var maxW = 1200, maxH = 1200;
            var w = img.width, h = img.height;
            if(w > maxW || h > maxH){
              if(w > h){ h = Math.round(h * maxW / w); w = maxW; }
              else { w = Math.round(w * maxH / h); h = maxH; }
            }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var base64 = canvas.toDataURL('image/jpeg', 0.8);
            var b = B();
            b.timetableImg = base64;
            if(save()){ closeSheet(); render(); toast('تم حفظ جدول المحاضرات بنجاح ✓'); }
            else { toast('تعذر الحفظ: حجم الصورة كبير جداً'); }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        ttInput.value = '';
      });
    }

    document.addEventListener('change', function(e){
      var t = e.target, b = B();
      if(t.dataset.note){ b.week.notes = b.week.notes || {}; b.week.notes[t.dataset.note] = t.value; save(); toast('تم حفظ الملاحظة ✓'); }
      else if(t.id==='yr'){ S.settings.year = t.value.trim(); rollover(B()); save(); render(); toast('تم تحديث السنة الدراسية'); }
      else if(t.name === 'wd'){ var d = [...document.querySelectorAll('[name=wd]:checked')].map(function(x){ return +x.value; }); if(!d.length){ t.checked = true; return toast('اختر يوم دوام واحدًا على الأقل'); } S.settings.days = d; save(); }
      else if(t.id === 'gl'){ S.settings.goal = Math.min(100, Math.max(10, +t.value || 90)); save(); toast('تم حفظ الهدف ✓'); }
      else if(t.id === 'fi' && t.files[0]){
        var r = new FileReader();
        r.onload = function(){
          var o = null;
          try { o = JSON.parse(r.result); } catch(err){}
          if(!validate(o)) toast('الملف غير صالح — لم يتم تغيير بياناتك');
          else ask('سيتم استبدال بياناتك الحالية بالنسخة المستوردة.', 'استيراد', function(){ S = o; S.settings.done = true; if(!Array.isArray(S.alarms)) S.alarms = []; rollover(B()); save(); applyTheme(); render(); toast('تم استيراد البيانات ✓'); }, false);
          t.value = '';
        };
        r.readAsText(t.files[0]);
      }
    });
    addEventListener('hashchange', function(){ closeSheet(); render(); scrollTo(0, 0); });
    setInterval(tick, 20000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });

    if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js?v=12').catch(function(){});
    }
  } catch(err) {
    console.error(err);
    if(window.onerror) window.onerror(err.message, '', 0);
  }
}
if(typeof document !== 'undefined') boot();
</script>
</body>
</html>
